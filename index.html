<style>
/* ============================================================
   QUILL — encrypted private blog
   2000s chrome, modern ergonomics
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
:root{
  --font:"Lucida Grande","Segoe UI",Verdana,Tahoma,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --mono:"Lucida Console",Monaco,Consolas,"SF Mono",Menlo,"Roboto Mono",ui-monospace,monospace;
  --disp:"Eurostile","Microgramma","Bank Gothic","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --r:12px; --rs:8px; --ease:cubic-bezier(.2,.8,.2,1);
  --tap:44px; --ui:15px;
  --sel-t:inherit; --glass:none; --bevel:inset 0 1px 0 var(--pan-hi);
  --txglow:none;
}
/* ---------- SKINS ---------- */

  --pan:linear-gradient(180deg,#171c23,#11151b);--pan-s:#13181e;--pan-b:#262e39;--pan-hi:rgba(255,255,255,.065);--sh:0 14px 40px rgba(0,0,0,.5);

  --pri:linear-gradient(180deg,#a6f8ff 0%,#4fe4ff 46%,#14b4da 54%,#3cd8f8 100%);--pri-b:#0a8db0;--pri-t:#00222c;
  --in:#0a0e13;--in-b:#2a3340;
  --lcd:#06140f;--lcd-t:#7dffb2;--lcd-b:#14402e;--lcd-glow:0 0 7px rgba(125,255,178,.55);
  --sel:linear-gradient(180deg,rgba(62,224,255,.20),rgba(62,224,255,.10));--sel-b:rgba(62,224,255,.5);--hov:rgba(255,255,255,.04);
  --paper:#0e1318;--paper-t:#dde7f0;--paper-b:#212a33;
  --mark:rgba(255,214,0,.34);--dng:#ff5d6c;--ok:#5dffa0;--warn:#ffc04d;
}

  --tx:#18202e;--tx2:#4b586d;--tx3:#8793a6;

  --btn:linear-gradient(180deg,#062206,#031403);--btn-b:#17701c;--btn-t:#39ff14;--btn-hi:rgba(57,255,20,.12);

  --sel:rgba(57,255,20,.18);--sel-b:#39ff14;--hov:rgba(57,255,20,.06);

  --mark:rgba(57,255,20,.35);--dng:#ff4040;--ok:#39ff14;--warn:#e8ff3a;
  --txglow:0 0 4px rgba(57,255,20,.45);
}
[data-skin=aero]{color-scheme:light;
  --bg:#a9def7;
  --bgfx:radial-gradient(circle at 14% 26%,rgba(255,255,255,.75) 0 46px,rgba(255,255,255,.15) 47px 50px,transparent 51px),radial-gradient(circle at 82% 16%,rgba(255,255,255,.55) 0 28px,rgba(255,255,255,.12) 29px 31px,transparent 32px),radial-gradient(circle at 64% 70%,rgba(255,255,255,.35) 0 70px,transparent 71px),radial-gradient(circle at 30% 82%,rgba(255,255,255,.4) 0 22px,transparent 23px),radial-gradient(ellipse 120% 40% at 50% 120%,#7fd36b 0 55%,transparent 56%),linear-gradient(180deg,#5cc4f2 0%,#c8eefc 58%,#e9fbff 100%);
  --pan:linear-gradient(180deg,rgba(255,255,255,.82),rgba(236,248,255,.66));--pan-s:rgba(245,252,255,.9);--pan-b:rgba(255,255,255,.95);--pan-hi:#ffffff;--sh:0 14px 40px rgba(0,70,120,.25);
  --glass:blur(18px) saturate(1.5);
  --tb:linear-gradient(180deg,rgba(255,255,255,.95) 0%,rgba(225,245,255,.85) 50%,rgba(190,232,252,.85) 51%,rgba(215,243,255,.9) 100%);--tb-t:#0b3d5c;--tb-b:rgba(100,170,210,.5);
  --tx:#0c2a3c;--tx2:#3e6276;--tx3:#7f9fb0;
  --acc:#0b9bd6;--acc2:#2fb84f;--acc-t:#ffffff;
  --btn:linear-gradient(180deg,rgba(255,255,255,.98) 0%,rgba(240,250,255,.95) 49%,rgba(214,238,250,.95) 51%,rgba(236,249,255,.98) 100%);--btn-b:#8cc3dd;--btn-t:#0c2a3c;--btn-hi:#ffffff;
  --pri:linear-gradient(180deg,#c3f7a6 0%,#64d95c 46%,#2db04a 54%,#62e06a 100%);--pri-b:#24903e;--pri-t:#03300f;
  --in:rgba(255,255,255,.92);--in-b:#8cc3dd;
  --lcd:#0b2b3a;--lcd-t:#7ee8ff;--lcd-b:#24607a;--lcd-glow:0 0 7px rgba(126,232,255,.6);
  --sel:linear-gradient(180deg,#5fcbf5,#1aa1db);--sel-b:#1290c8;--sel-t:#fff;--hov:rgba(11,155,214,.08);
  --paper:rgba(255,255,255,.94);--paper-t:#10222c;--paper-b:#cde7f3;
  --mark:#fff36e;--dng:#d8343a;--ok:#22973d;--warn:#c47a00;
}
[data-skin=amp]{color-scheme:dark;
  --bg:#0c0c10;
  --bgfx:repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px),radial-gradient(900px 500px at 50% -10%,rgba(245,166,35,.10),transparent 65%);
  --pan:linear-gradient(180deg,#2a2a36,#1c1c25);--pan-s:#22222c;--pan-b:#4a4a5e;--pan-hi:rgba(255,255,255,.09);--sh:0 14px 36px rgba(0,0,0,.55);
  --tb:repeating-linear-gradient(180deg,#3c3c56 0 2px,#2c2c42 2px 4px);--tb-t:#ecd27c;--tb-b:#121218;
  --tx:#d8d8e4;--tx2:#9a9ab0;--tx3:#62627a;
  --acc:#f5a623;--acc2:#00e639;--acc-t:#2a1600;
  --btn:linear-gradient(180deg,#45455a 0%,#383849 49%,#2b2b39 51%,#33333f 100%);--btn-b:#5c5c74;--btn-t:#e6e6f0;--btn-hi:rgba(255,255,255,.14);
  --pri:linear-gradient(180deg,#ffdc8c 0%,#f8ae32 46%,#d98400 54%,#f2a72a 100%);--pri-b:#a86400;--pri-t:#2a1600;
  --in:#0b0b0f;--in-b:#444458;
  --lcd:#000000;--lcd-t:#00e639;--lcd-b:#2b2b38;--lcd-glow:0 0 6px rgba(0,230,57,.6);
  --sel:linear-gradient(180deg,#1d1db8,#10108a);--sel-b:#3a3aff;--sel-t:#fff;--hov:rgba(255,255,255,.04);
  --paper:#15151c;--paper-t:#e2e2ec;--paper-b:#33333f;
  --mark:rgba(245,166,35,.4);--dng:#ff5a4a;--ok:#00e639;--warn:#f5a623;

/* paper overrides */
[data-paper=light]{--paper:#fffffd;--paper-t:#1b1b1b;--paper-b:#d8dbe0}
[data-paper=dark]{--paper:#111418;--paper-t:#e2e8ee;--paper-b:#262c33}
[data-paper=sepia]{--paper:#f6eedb;--paper-t:#3b2f1f;--paper-b:#dccfae}

/* ---------- BASE ---------- */
html{font-size:var(--ui);-webkit-text-size-adjust:100%;height:100%;background:var(--bg)}
body{margin:0;height:100%;overflow:hidden;position:fixed;inset:0;font-family:var(--font);color:var(--tx);background:var(--bgfx),var(--bg);background-attachment:fixed;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;touch-action:manipulation;text-shadow:var(--txglow);-webkit-tap-highlight-color:transparent;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
a{color:var(--acc)}
::selection{background:color-mix(in srgb,var(--acc) 35%,transparent)}
.hidden{display:none!important}
.mono{font-family:var(--mono)}
.dim{color:var(--tx2)}
.faint{color:var(--tx3)}
.grow{flex:1 1 auto;min-width:0}
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column;gap:8px}
.wrap{flex-wrap:wrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
svg.i.sm{width:16px;height:16px}
svg.i.lg{width:28px;height:28px}
.scan::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9000;background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.11) 2px 3px);mix-blend-mode:multiply}
.scan.lightscan::after{opacity:.28}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:linear-gradient(90deg,color-mix(in srgb,var(--tx3) 55%,transparent),color-mix(in srgb,var(--tx3) 35%,transparent));border-radius:10px;border:2px solid transparent;background-clip:padding-box}
.lbl{font-family:var(--disp);text-transform:uppercase;letter-spacing:.18em;font-size:.66rem;font-weight:400;color:var(--tx2)}

/* ---------- PANELS / CHROME ---------- */
.panel{background:var(--pan);border:1px solid var(--pan-b);border-radius:var(--r);box-shadow:var(--bevel),var(--sh);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);overflow:hidden;display:flex;flex-direction:column;min-height:0}
.tbar{flex:none;display:flex;align-items:center;gap:8px;min-height:34px;padding:0 10px;background:var(--tb);color:var(--tb-t);border-bottom:1px solid var(--tb-b);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.tbar .ttl{font-family:var(--disp);text-transform:uppercase;letter-spacing:.2em;font-size:.68rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[data-skin=luna] .tbar .ttl,[data-skin=luna] .titlebar .brand b{text-shadow:1px 1px 0 rgba(0,0,0,.35)}
.led{width:8px;height:8px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff 0 12%,var(--ok) 40%,color-mix(in srgb,var(--ok) 60%,#000) 100%);box-shadow:0 0 6px var(--ok)}
.led.amber{--ok:var(--warn)}
.led.red{--ok:var(--dng)}
.led.off{background:radial-gradient(circle at 35% 30%,#888 0 10%,#333 60%);box-shadow:none}

/* ---------- BUTTONS ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:var(--tap);min-width:var(--tap);padding:0 14px;border-radius:var(--rs);border:1px solid var(--btn-b);background:var(--btn);color:var(--btn-t);
  box-shadow:inset 0 1px 0 var(--btn-hi),0 1px 2px rgba(0,0,0,.18);font-size:.86rem;white-space:nowrap;user-select:none;-webkit-user-select:none;transition:filter .15s,transform .08s,box-shadow .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active,.btn.on{transform:translateY(1px);box-shadow:inset 0 2px 6px rgba(0,0,0,.28)}
.btn.on{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--pri);border-color:var(--pri-b);color:var(--pri-t);font-weight:700;text-shadow:0 1px 0 rgba(255,255,255,.25)}
[data-skin=luna] .btn.pri,[data-skin=amp] .btn.pri{text-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.pri::before{content:"";position:absolute;left:6%;right:6%;top:2px;height:42%;border-radius:6px 6px 40% 40%/6px 6px 10px 10px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.05));pointer-events:none}
.btn.dng{color:var(--dng)}
.btn.dng.solid{background:linear-gradient(180deg,#ff8b8b,#e33b3b 50%,#c42020 51%,#e04040);color:#fff;border-color:#9e1a1a}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--hov)}
.btn.ico{padding:0;width:var(--tap)}
.btn.sm{min-height:34px;min-width:34px;padding:0 10px;font-size:.8rem}
.btn.sm.ico{width:34px;padding:0}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn .k{font-family:var(--mono);font-size:.68rem;opacity:.6;border:1px solid currentColor;border-radius:4px;padding:0 4px}
.tbar .btn{min-height:30px;min-width:30px;background:transparent;border-color:transparent;box-shadow:none;color:var(--tb-t)}
.tbar .btn:hover{background:rgba(255,255,255,.12)}
.seg{display:inline-flex;border:1px solid var(--btn-b);border-radius:var(--rs);overflow:hidden;box-shadow:inset 0 1px 0 var(--btn-hi)}
.seg button{border:0;border-right:1px solid var(--btn-b);background:var(--btn);color:var(--btn-t);min-height:38px;padding:0 12px;font-size:.8rem}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--sel);color:var(--sel-t);box-shadow:inset 0 2px 5px rgba(0,0,0,.2)}

/* ---------- INPUTS ---------- */
.inp,select.inp,textarea.inp{width:100%;min-height:var(--tap);padding:0 12px;border-radius:var(--rs);border:1px solid var(--in-b);background:var(--in);color:var(--tx);box-shadow:inset 0 2px 4px rgba(0,0,0,.14);outline:none;font-size:16px;transition:border-color .15s,box-shadow .15s}
textarea.inp{padding:10px 12px;min-height:90px;resize:vertical;line-height:1.4}
.inp:focus{border-color:var(--acc);box-shadow:inset 0 2px 4px rgba(0,0,0,.14),0 0 0 3px color-mix(in srgb,var(--acc) 28%,transparent)}
.inp.mono{font-family:var(--mono);letter-spacing:.04em}
select.inp{appearance:none;-webkit-appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--tx2) 50%),linear-gradient(135deg,var(--tx2) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 12px) 52%;background-size:6px 6px;background-repeat:no-repeat}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label{font-size:.78rem;color:var(--tx2)}
.inp-wrap{position:relative}
.inp-wrap .inp{padding-right:48px}
.inp-wrap .peek{position:absolute;right:2px;top:50%;transform:translateY(-50%)}
.check{display:flex;align-items:center;gap:10px;min-height:var(--tap);cursor:pointer;user-select:none}
.check input{display:none}
.tog{width:46px;height:26px;border-radius:20px;flex:none;position:relative;border:1px solid var(--btn-b);background:var(--in);box-shadow:inset 0 2px 4px rgba(0,0,0,.25);transition:background .2s}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--btn);border:1px solid var(--btn-b);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s var(--ease)}
.check input:checked+.tog{background:var(--pri);border-color:var(--pri-b)}
.check input:checked+.tog::after{transform:translateX(20px)}
input[type=range]{width:100%;accent-color:var(--acc);min-height:var(--tap)}
input[type=color]{width:var(--tap);height:var(--tap);border:1px solid var(--btn-b);border-radius:var(--rs);background:var(--btn);padding:4px}

/* ---------- LCD ---------- */
.lcd{font-family:var(--mono);background:var(--lcd);color:var(--lcd-t);border:1px solid var(--lcd-b);border-radius:6px;padding:4px 9px;text-shadow:var(--lcd-glow);box-shadow:inset 0 2px 6px rgba(0,0,0,.45),0 1px 0 var(--pan-hi);letter-spacing:.08em;white-space:nowrap;font-size:.8rem;position:relative;overflow:hidden}
.lcd::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 2px,rgba(0,0,0,.14) 2px 3px);pointer-events:none}
.lcd.big{font-size:1.5rem;padding:8px 14px;letter-spacing:.12em}

/* ---------- BOOT ---------- */
#boot{position:fixed;inset:0;z-index:10000;background:#000;color:#b7c4cf;font-family:var(--mono);font-size:13px;padding:28px 30px;overflow:hidden;transition:opacity .35s}
#boot .ln{white-space:pre;line-height:1.55}
#boot .ok{color:#5dffa0}
#boot .hi{color:#3ee0ff}
#boot .logo{color:#fff;font-size:15px;margin-bottom:10px}
#boot .cur{display:inline-block;width:9px;height:15px;background:#b7c4cf;vertical-align:-2px;animation:blink 1s steps(1) infinite}
#boot .skip{position:absolute;bottom:20px;right:24px;color:#566}
@keyframes blink{50%{opacity:0}}

/* ---------- SHIELD ---------- */
#shield{position:fixed;inset:0;z-index:9500;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;backdrop-filter:blur(30px) saturate(.6);-webkit-backdrop-filter:blur(30px) saturate(.6);background:color-mix(in srgb,var(--bg) 70%,transparent);color:var(--tx)}
.shielded #shield{display:flex}
.shielded #app,.shielded #login{filter:blur(24px)}

/* ---------- LOGIN ---------- */
#login{position:fixed;inset:0;display:flex;flex-direction:column;height:var(--vvh,100dvh)}
.lg-top,.lg-bot{flex:none;display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-left));background:linear-gradient(180deg,color-mix(in srgb,var(--pan-s) 92%,transparent),color-mix(in srgb,var(--pan-s) 78%,transparent));border-bottom:1px solid var(--pan-b);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.lg-top{padding-top:max(10px,env(safe-area-inset-top))}
.lg-bot{border-top:1px solid var(--pan-b);border-bottom:0;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.lg-mid{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;min-height:0}
.lg-split{display:grid;grid-template-columns:1fr 2px 1fr;gap:40px;align-items:center;width:min(1000px,100%)}
.lg-div{align-self:stretch;min-height:320px;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--tx) 45%,transparent),transparent)}
.lg-brand{text-align:right}
.lg-brand .feather{width:72px;height:72px;color:var(--acc);filter:drop-shadow(0 0 14px color-mix(in srgb,var(--acc) 60%,transparent))}
.wordmark{font-family:var(--disp);font-weight:300;letter-spacing:.42em;text-transform:uppercase;font-size:3rem;line-height:1;margin:10px 0 6px;margin-right:-.42em;background:linear-gradient(180deg,var(--tx) 0%,var(--tx) 52%,color-mix(in srgb,var(--tx) 55%,transparent) 53%,var(--tx) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
[data-skin=luna] .lg-brand{color:#fff;text-shadow:0 2px 6px rgba(0,40,100,.4)}
[data-skin=aero] .wordmark{background:linear-gradient(180deg,#0b4a6e 0 52%,#1789b8 53% 100%);-webkit-background-clip:text;background-clip:text}
[data-skin=luna] .wordmark{background:linear-gradient(180deg,#fff 0 52%,#e3f0ff 53% 100%);-webkit-background-clip:text;background-clip:text}
.lg-brand .tag{font-size:.95rem;opacity:.85}
.lg-users{display:flex;flex-direction:column;gap:10px;max-height:62vh;overflow:auto;padding:4px}
.utile{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:14px;border:1px solid transparent;cursor:pointer;transition:background .2s,border-color .2s;text-align:left;background:transparent;width:100%}
.utile:hover,.utile.open{background:color-mix(in srgb,var(--pan-s) 80%,transparent);border-color:var(--pan-b);box-shadow:var(--sh);backdrop-filter:blur(10px)}
[data-skin=luna] .utile:not(.open){color:#fff}
[data-skin=luna] .utile:not(.open) .dim{color:#dbe9ff}
.avatar{width:58px;height:58px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:30px;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35),inset 0 0 0 1px rgba(0,0,0,.15);position:relative;overflow:hidden}
.avatar::after{content:"";position:absolute;left:0;right:0;top:0;height:48%;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.08))}
.avatar.sm{width:36px;height:36px;font-size:18px;border-radius:9px;border-width:1.5px}
.utile.open{align-items:flex-start}
.utile .nm{font-size:1.15rem;font-weight:600}
.u-form{margin-top:10px;display:flex;gap:8px;align-items:center}
.u-form .inp{flex:1}
.go{width:var(--tap);height:var(--tap);border-radius:10px;flex:none;border:1px solid var(--pri-b);background:var(--pri);color:var(--pri-t);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 6px rgba(0,0,0,.25);position:relative}
.go::before{content:"";position:absolute;left:3px;right:3px;top:2px;height:44%;border-radius:8px 8px 40% 40%;background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,0))}
.u-links{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.u-links .btn{min-height:34px;font-size:.78rem}
.u-msg{font-size:.82rem;margin-top:8px;min-height:1.2em}
.u-msg.err{color:var(--dng)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center;margin-top:12px}
.pinpad .btn{height:62px;font-size:1.4rem;font-family:var(--mono);border-radius:14px}
.pindots{display:flex;gap:12px;justify-content:center;margin:6px 0 4px}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--tx2);transition:background .15s}
.pindots i.f{background:var(--acc);border-color:var(--acc);box-shadow:0 0 8px var(--acc)}

/* ---------- WIZARD / SETUP ---------- */
.win{width:min(560px,100%);max-height:calc(var(--vvh,100dvh) - 140px)}
.win .body{padding:20px;overflow:auto}
.steps{display:flex;gap:6px;margin-bottom:16px}
.steps i{flex:1;height:4px;border-radius:4px;background:color-mix(in srgb,var(--tx3) 40%,transparent)}
.steps i.on{background:var(--acc);box-shadow:0 0 6px var(--acc)}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px}
.avgrid button{border:2px solid transparent;border-radius:14px;padding:3px;background:transparent}
.avgrid button.on{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
.avgrid .avatar{width:100%;height:auto;aspect-ratio:1}
.meter{display:flex;gap:4px;margin-top:8px}
.meter i{flex:1;height:8px;border-radius:2px;background:color-mix(in srgb,var(--tx3) 30%,transparent)}
.meter.s1 i:nth-child(-n+1){background:var(--dng)}
.meter.s2 i:nth-child(-n+2){background:var(--warn)}
.meter.s3 i:nth-child(-n+3){background:var(--acc)}
.meter.s4 i:nth-child(-n+4){background:var(--ok);box-shadow:0 0 6px var(--ok)}
.lcd.reckey{white-space:normal;overflow-wrap:anywhere}
.reckey{font-family:var(--mono);font-size:1.05rem;letter-spacing:.06em;line-height:1.8;text-align:center;word-spacing:.3em;user-select:all;-webkit-user-select:all}
.note{border:1px solid var(--pan-b);border-left:4px solid var(--warn);border-radius:8px;padding:10px 12px;font-size:.82rem;background:color-mix(in srgb,var(--warn) 8%,transparent);margin:10px 0}
.note.info{border-left-color:var(--acc);background:color-mix(in srgb,var(--acc) 7%,transparent)}

/* ---------- APP SHELL ---------- */
#app{position:fixed;left:0;right:0;top:0;height:var(--vvh,100dvh);display:flex;flex-direction:column;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) 0 max(8px,env(safe-area-inset-left));gap:8px}
.titlebar{flex:none;display:flex;align-items:center;gap:6px;height:52px;padding:0 8px;border-radius:var(--r);background:var(--tb);color:var(--tb-t);border:1px solid var(--tb-b);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),var(--sh);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}
.titlebar .btn{min-height:40px;min-width:40px;background:transparent;border-color:transparent;box-shadow:none;color:var(--tb-t)}
.titlebar .btn:hover{background:rgba(255,255,255,.12)}
.brand{display:flex;align-items:center;gap:8px;padding:0 6px;user-select:none}
.brand svg{color:var(--acc);filter:drop-shadow(0 0 6px color-mix(in srgb,var(--acc) 60%,transparent))}
[data-skin=luna] .brand svg{color:#fff}
.brand b{font-family:var(--disp);font-weight:400;letter-spacing:.38em;font-size:.95rem}
.brand small{font-family:var(--mono);font-size:.62rem;opacity:.6;border:1px solid currentColor;border-radius:4px;padding:0 4px}
.crumb{font-size:.8rem;opacity:.85;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.titlebar .lcd{font-size:.78rem}
.leds{display:flex;gap:5px;padding:0 6px}
.main{flex:1;display:flex;gap:8px;min-height:0}
.sidebar{width:252px;flex:none}
.sidebar .scroll{flex:1;overflow:auto;padding:10px 8px 14px;-webkit-overflow-scrolling:touch}
.content{flex:1;display:flex;gap:8px;min-width:0;min-height:0}
.listpane{width:360px;flex:none}
.detail{flex:1;min-width:0}
.statusbar{flex:none;display:flex;align-items:center;gap:6px;min-height:30px;padding:3px 8px max(4px,env(safe-area-inset-bottom));font-size:.72rem;color:var(--tx2);overflow:hidden;white-space:nowrap}
.statusbar .cell{display:flex;align-items:center;gap:6px;padding:2px 10px;border:1px solid var(--pan-b);border-radius:6px;background:color-mix(in srgb,var(--pan-s) 80%,transparent);box-shadow:inset 0 1px 2px rgba(0,0,0,.18);font-family:var(--mono);letter-spacing:.03em;backdrop-filter:var(--glass)}
[data-skin=luna] .statusbar .cell{color:var(--tx)}
.statusbar .sp{flex:1}

/* sidebar nav */
.nav-sec{margin-top:14px}
.nav-sec>.lbl{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 6px;cursor:pointer;user-select:none}
.nav-sec>.lbl .btn{min-height:26px;min-width:26px;width:26px}
.nav-sec.closed>.items{display:none}
.nav-sec>.lbl .chev{transition:transform .2s}
.nav-sec.closed>.lbl .chev{transform:rotate(-90deg)}
.nitem{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 10px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--tx);text-align:left;font-size:.88rem}
.nitem:hover{background:var(--hov)}
.nitem.on{background:var(--sel);border-color:var(--sel-b);color:var(--sel-t);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.nitem .ct{margin-left:auto;font-family:var(--mono);font-size:.7rem;opacity:.7}
.nitem .sw{width:10px;height:10px;border-radius:3px;flex:none}
.nitem span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cloud{display:flex;flex-wrap:wrap;gap:4px 8px;padding:4px 8px;line-height:1.25}
.cloud button{border:0;background:transparent;color:var(--acc);padding:3px 2px;cursor:pointer;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--acc) 35%,transparent);text-underline-offset:3px}
.cloud button.on{background:var(--sel);color:var(--sel-t);border-radius:4px;padding:3px 6px;text-decoration:none}
.tree .yr{font-weight:600}
.tree .mo{padding-left:30px;min-height:36px;font-size:.84rem}
.counter{margin:16px 6px 4px;padding:10px;border-radius:10px;border:1px solid var(--pan-b);background:color-mix(in srgb,var(--pan-s) 60%,transparent);text-align:center}
.digits{display:inline-flex;gap:2px;margin:6px 0 2px}
.digits b{font-family:var(--mono);font-size:1.05rem;width:1.15em;line-height:1.6;background:linear-gradient(180deg,#222 0 50%,#000 50% 100%);color:#fff;border-radius:3px;box-shadow:inset 0 0 0 1px #444,0 1px 0 rgba(255,255,255,.2);position:relative}
.digits b::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.9)}
[data-skin=phosphor] .digits b{color:#39ff14}
.newbtn{width:100%;min-height:48px;font-size:.95rem}

/* list pane */
.lp-tools{flex:none;padding:10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--pan-b)}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--tx3);pointer-events:none}
.search .inp{padding-left:38px;padding-right:44px}
.search .help{position:absolute;right:2px;top:50%;transform:translateY(-50%)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 4px 2px 10px;min-height:28px;border-radius:20px;border:1px solid var(--pan-b);background:var(--btn);font-size:.76rem;color:var(--btn-t);box-shadow:inset 0 1px 0 var(--btn-hi)}
.chip button{border:0;background:transparent;color:inherit;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;padding:0}
.chip.tg{padding:2px 10px;cursor:pointer}
.lp-info{display:flex;align-items:center;gap:8px;justify-content:space-between}
.lp-list{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 6px 80px;position:relative}
.ghead{position:sticky;top:0;z-index:2;font-family:var(--disp);text-transform:uppercase;letter-spacing:.18em;font-size:.6rem;color:var(--tx2);padding:10px 8px 5px;background:linear-gradient(180deg,var(--pan-s) 70%,transparent)}
.rowwrap{position:relative;border-radius:10px;overflow:hidden;margin:3px 0;touch-action:pan-y}
.rowbg{position:absolute;inset:0;display:none;align-items:center;justify-content:space-between;padding:0 18px;font-size:.8rem;font-weight:700;color:#fff}
.rowbg .l{background:linear-gradient(90deg,#e6a700,#ffcf3a);position:absolute;inset:0 50% 0 0;display:flex;align-items:center;padding-left:18px;gap:8px}
.rowbg .r{background:linear-gradient(270deg,#c71f2d,#ff5d6c);position:absolute;inset:0 0 0 50%;display:flex;align-items:center;justify-content:flex-end;padding-right:18px;gap:8px}
.rowwrap.swiping .rowbg{display:flex}
.prow{position:relative;display:flex;gap:10px;padding:10px 10px 10px 14px;border-radius:10px;border:1px solid transparent;background:var(--pan-s);cursor:pointer;transition:background .15s,transform .25s var(--ease);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.prow:hover{background:color-mix(in srgb,var(--pan-s) 92%,var(--tx))}
.prow.on{background:var(--sel);border-color:var(--sel-b);color:var(--sel-t);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.prow.on .dim,.prow.on .faint{color:inherit;opacity:.8}
.prow .stripe{position:absolute;left:4px;top:10px;bottom:10px;width:3px;border-radius:3px}
.prow .ck{display:none;width:24px;height:24px;border-radius:6px;border:2px solid var(--tx3);flex:none;align-self:center;place-items:center}
.selmode .prow .ck{display:grid}
.prow.picked .ck{background:var(--acc);border-color:var(--acc);color:var(--acc-t)}
.prow .pt{font-weight:700;font-size:.94rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .sn{font-size:.8rem;color:var(--tx2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px;line-height:1.4}
.prow .meta{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:.7rem;color:var(--tx3);font-family:var(--mono);flex-wrap:wrap}
.prow .meta .tg{color:var(--acc)}
.prow.on .meta .tg{color:inherit}
.prow .flags{display:flex;gap:2px;align-self:flex-start;color:var(--warn)}
.badge{font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:4px;border:1px solid currentColor}
.badge.draft{color:var(--warn)}
mark,.hl{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.v-compact .prow{padding:6px 10px 6px 14px}
.v-compact .prow .sn,.v-compact .prow .meta .tgs{display:none}
.v-compact .prow .meta{margin-top:1px}
.v-cards .lp-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;align-content:start}
.v-cards .ghead{grid-column:1/-1}
.v-cards .rowwrap{margin:0}
.v-cards .prow{flex-direction:column;padding:0;height:100%}
.v-cards .prow .cover{height:84px;border-radius:9px 9px 0 0;background-size:cover;background-position:center;position:relative}
.v-cards .prow .cbody{padding:8px 10px 10px}
.v-cards .prow .stripe{display:none}
.v-cards .prow .flags{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.45);border-radius:6px;padding:2px}
.prow .cover{display:none}
.v-cards .prow .cover{display:block}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:40px 20px;color:var(--tx2);height:100%}
.empty .big{font-family:var(--disp);letter-spacing:.3em;text-transform:uppercase;font-size:.85rem}
.empty>svg.i{width:56px;height:56px;stroke-width:1;color:var(--tx3)}
.bulkbar{position:absolute;left:8px;right:8px;bottom:8px;z-index:5;display:flex;gap:4px;align-items:center;padding:6px;border-radius:12px;background:var(--pan-s);border:1px solid var(--pan-b);box-shadow:var(--sh);overflow-x:auto}
.bulkbar .n{font-family:var(--mono);font-size:.75rem;padding:0 8px;white-space:nowrap}
.listpane{position:relative}

/* ---------- EDITOR ---------- */
.ed{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.ed-tb{flex:none;display:flex;align-items:center;gap:3px;padding:6px;overflow-x:auto;overflow-y:hidden;border-bottom:1px solid var(--pan-b);background:color-mix(in srgb,var(--pan-s) 70%,transparent);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ed-tb::-webkit-scrollbar{display:none}
.ed-tb.ovf{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 46px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 46px),transparent)}
.ed-tb .sep{width:1px;align-self:stretch;margin:4px 3px;background:linear-gradient(180deg,transparent,var(--pan-b),transparent);flex:none}
.ed-tb .btn{min-height:40px;min-width:40px;padding:0 8px;flex:none}
.ed-tb .btn.ico{width:40px;padding:0}
.ed-tb select.inp{width:auto;min-height:40px;font-size:.8rem;flex:none;padding-left:10px}
.ed-tb .gl{font-family:Georgia,"Times New Roman",serif;font-size:1.05rem;width:16px;text-align:center}
.colorbar{display:block;height:3px;width:18px;border-radius:2px;margin-top:-3px}
.ed-scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--paper);color:var(--paper-t);position:relative}
.ed-paper{max-width:780px;margin:0 auto;padding:26px 34px 40vh}
.ed-date{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.ed-title{width:100%;border:0;outline:0;background:transparent;color:var(--paper-t);font-family:var(--disp);font-weight:300;font-size:2rem;letter-spacing:.02em;padding:4px 0;line-height:1.2}
.ed-title::placeholder{color:color-mix(in srgb,var(--paper-t) 35%,transparent)}
.tags-in{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 0 14px;border-bottom:1px dashed var(--paper-b);margin-bottom:16px;position:relative}
.tags-in input{border:0;outline:0;background:transparent;color:var(--paper-t);min-width:120px;flex:1;min-height:32px;font-size:15px}
.tags-in .chip{background:color-mix(in srgb,var(--acc) 14%,transparent);border-color:color-mix(in srgb,var(--acc) 45%,transparent);color:var(--paper-t);box-shadow:none}
.suggest{position:absolute;top:100%;left:0;z-index:20;min-width:200px;max-height:220px;overflow:auto;background:var(--pan-s);border:1px solid var(--pan-b);border-radius:10px;box-shadow:var(--sh);padding:4px}
.suggest button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--tx);padding:9px 10px;border-radius:6px;min-height:38px}
.suggest button:hover,.suggest button.on{background:var(--sel);color:var(--sel-t)}
.ed-body{outline:none;min-height:40vh;font-size:var(--edsize,17px);line-height:1.7;font-family:var(--edfont,Verdana),sans-serif;word-wrap:break-word;overflow-wrap:anywhere;caret-color:var(--acc)}
.ed-body:empty::before{content:attr(data-ph);color:color-mix(in srgb,var(--paper-t) 35%,transparent);pointer-events:none}
.ed-current{margin-top:30px;padding-top:14px;border-top:1px dashed var(--paper-b);display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;font-size:.85rem}
.ed-current b{font-weight:700;color:color-mix(in srgb,var(--paper-t) 70%,transparent)}
.ed-current .inp{min-height:40px;background:transparent;color:var(--paper-t);border-color:var(--paper-b);box-shadow:none}
.ed-foot{flex:none;display:flex;align-items:center;gap:8px;padding:6px 10px;border-top:1px solid var(--pan-b);font-size:.72rem;color:var(--tx2);font-family:var(--mono);overflow-x:auto;white-space:nowrap}
.goalbar{width:80px;height:8px;border-radius:4px;background:var(--in);border:1px solid var(--in-b);overflow:hidden;flex:none}
.goalbar i{display:block;height:100%;background:var(--pri)}
/* rich content (editor + journal) */
.rich h1{font-size:1.8em;line-height:1.25;margin:.8em 0 .3em;font-family:var(--disp);font-weight:300;letter-spacing:.02em}
.rich h2{font-size:1.4em;line-height:1.3;margin:.8em 0 .3em}
.rich h3{font-size:1.15em;margin:.8em 0 .3em;text-transform:uppercase;letter-spacing:.08em}
.rich p{margin:0 0 .8em}
.rich blockquote{margin:1em 0;padding:.4em 1em;border-left:4px solid var(--acc);background:color-mix(in srgb,var(--acc) 8%,transparent);border-radius:0 8px 8px 0;font-style:italic}
.rich pre{font-family:var(--mono);font-size:.85em;background:#0b0f14;color:#b8f5c8;padding:12px 14px;border-radius:8px;overflow:auto;white-space:pre-wrap;border:1px solid #1d2a22;line-height:1.5}
.rich code{font-family:var(--mono);font-size:.88em;background:color-mix(in srgb,var(--paper-t) 10%,transparent);padding:1px 5px;border-radius:4px}
.rich pre code{background:transparent;padding:0}
.rich hr{border:0;height:2px;margin:1.6em auto;width:60%;background:linear-gradient(90deg,transparent,var(--acc),transparent)}
.rich img{max-width:100%;height:auto;border-radius:8px;display:block;margin:.6em auto;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.rich img.q-s{width:33%}.rich img.q-m{width:50%}.rich img.q-l{width:75%}.rich img.q-f{width:100%}
.rich img.q-left{float:left;margin:.3em 1.2em .6em 0}.rich img.q-right{float:right;margin:.3em 0 .6em 1.2em}
.rich img.sel{outline:3px solid var(--acc);outline-offset:2px}
.rich table{border-collapse:collapse;width:100%;margin:1em 0;font-size:.92em}
.rich th,.rich td{border:1px solid var(--paper-b);padding:6px 10px;min-width:40px;vertical-align:top}
.rich th{background:color-mix(in srgb,var(--acc) 12%,transparent);text-align:left}
.rich ul,.rich ol{padding-left:1.6em;margin:0 0 .8em}
.rich ul.checklist{list-style:none;padding-left:.2em}
.rich ul.checklist li{position:relative;padding-left:2em;min-height:1.7em}
.rich ul.checklist li::before{content:"";position:absolute;left:0;top:.25em;width:1.15em;height:1.15em;border:2px solid color-mix(in srgb,var(--paper-t) 50%,transparent);border-radius:4px;cursor:pointer}
.rich ul.checklist li[data-checked=true]{color:color-mix(in srgb,var(--paper-t) 50%,transparent);text-decoration:line-through}
.rich ul.checklist li[data-checked=true]::before{background:var(--acc);border-color:var(--acc);box-shadow:inset 0 0 0 2px var(--paper)}
.rich a{color:var(--acc);text-underline-offset:2px}
.rich::after{content:"";display:table;clear:both}
.floatbar{position:absolute;z-index:30;display:flex;gap:2px;padding:4px;border-radius:10px;background:var(--pan-s);border:1px solid var(--pan-b);box-shadow:var(--sh);flex-wrap:wrap;max-width:calc(100% - 20px)}
.floatbar .btn{min-height:36px;min-width:36px;padding:0 8px;font-size:.75rem}
.findbar{flex:none;display:flex;gap:6px;align-items:center;padding:6px;border-bottom:1px solid var(--pan-b);flex-wrap:wrap;background:color-mix(in srgb,var(--pan-s) 85%,transparent)}
.findbar .inp{min-height:38px;flex:1;min-width:120px}
.findbar .lcd{font-size:.7rem}
::highlight(qfind){background-color:rgba(255,200,0,.45)}
::highlight(qfindcur){background-color:rgba(255,120,0,.75);color:#000}
/* properties drawer */
.props{position:absolute;top:0;right:0;bottom:0;width:min(340px,92%);z-index:40;background:var(--pan-s);border-left:1px solid var(--pan-b);box-shadow:-10px 0 30px rgba(0,0,0,.3);transform:translateX(105%);transition:transform .28s var(--ease);display:flex;flex-direction:column;backdrop-filter:var(--glass)}
.props.open{transform:none}
.props .body{flex:1;overflow:auto;padding:14px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:2px solid var(--pan-b);box-shadow:inset 0 2px 4px rgba(255,255,255,.4),0 1px 3px rgba(0,0,0,.3)}
.swatches button.on{border-color:var(--tx);box-shadow:0 0 0 3px var(--acc)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-family:var(--mono);font-size:.72rem;color:var(--tx2);word-break:break-all}
.kv b{color:var(--tx3);font-weight:400;text-transform:uppercase;letter-spacing:.08em}
/* focus mode */
.focus .sidebar,.focus .listpane,.focus .titlebar,.focus .statusbar{display:none!important}
.focus #app{padding:0}
.focus .detail{border-radius:0;border:0}
.focus .ed-tb{opacity:.15;transition:opacity .3s}
.focus .ed-tb:hover,.focus .ed-tb:focus-within,.focus.touch .ed-tb{opacity:1}
.focus .ed-paper{padding-top:8vh}
.focus .detail>.tbar{display:none}
.exitfocus{display:none}
.focus .exitfocus{display:inline-flex}

/* ---------- JOURNAL ---------- */
.jr{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--paper);color:var(--paper-t)}
.jr-wrap{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:1fr 280px;gap:26px;padding:24px}
.jr-head{grid-column:1/-1;text-align:center;padding:26px 10px 20px;border-bottom:3px double var(--paper-b)}
.jr-head h1{font-family:var(--disp);font-weight:300;letter-spacing:.35em;text-transform:uppercase;margin:0;font-size:2rem}
.jr-head .sub{font-style:italic;opacity:.7;margin-top:6px;font-family:Georgia,serif}
.entry{margin-bottom:34px;border:1px solid var(--paper-b);border-radius:12px;overflow:hidden;background:color-mix(in srgb,var(--paper) 94%,var(--paper-t))}
.entry .edate{padding:8px 16px;font-family:var(--disp);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;background:var(--tb);color:var(--tb-t);display:flex;justify-content:space-between;align-items:center;gap:8px}
.entry .ebody{padding:18px 22px}
.entry h2.et{margin:0 0 4px;font-size:1.5rem;cursor:pointer}
.entry .etime{font-family:var(--mono);font-size:.72rem;opacity:.6;margin-bottom:14px}
.entry .rich{font-family:var(--edfont,Verdana),sans-serif;line-height:1.7}
.entry .efoot{padding:10px 22px 14px;font-size:.82rem;border-top:1px dashed var(--paper-b);display:flex;flex-direction:column;gap:4px}
.entry .efoot b{opacity:.65}
.entry .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.sticky-tag{background:var(--warn);color:#000;border-radius:4px;padding:0 6px;font-size:.62rem}
.wid{border:1px solid var(--paper-b);border-radius:12px;overflow:hidden;margin-bottom:16px}
.wid .tbar{min-height:30px}
.wid .wb{padding:12px;font-size:.84rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-family:var(--mono);font-size:.72rem}
.cal .h{opacity:.55;padding:3px 0}
.cal button{border:0;background:transparent;color:inherit;border-radius:6px;aspect-ratio:1;font:inherit;min-height:30px}
.cal button.has{background:color-mix(in srgb,var(--acc) 22%,transparent);font-weight:700;color:var(--paper-t)}
.cal button.today{outline:1px solid var(--acc)}
.cal button.on{background:var(--acc);color:var(--acc-t)}
.pager{display:flex;justify-content:space-between;gap:10px;margin:10px 0 30px}

/* ---------- STATS ---------- */
.pagewrap{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.tile{padding:12px;border-radius:12px;border:1px solid var(--pan-b);background:color-mix(in srgb,var(--pan-s) 70%,transparent)}
.tile .lcd{font-size:1.4rem;margin-top:6px;text-align:right}
.cardx{border:1px solid var(--pan-b);border-radius:12px;margin-bottom:14px;overflow:hidden;background:color-mix(in srgb,var(--pan-s) 70%,transparent)}
.cardx .cb{padding:14px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:6px}
.heat i{width:13px;height:13px;border-radius:3px;background:color-mix(in srgb,var(--tx3) 22%,transparent)}
.heat i.l1{background:color-mix(in srgb,var(--acc) 35%,transparent)}
.heat i.l2{background:color-mix(in srgb,var(--acc) 60%,transparent)}
.heat i.l3{background:color-mix(in srgb,var(--acc) 85%,transparent)}
.heat i.l4{background:var(--acc);box-shadow:0 0 5px var(--acc)}
.bars{display:flex;align-items:flex-end;gap:6px;height:160px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.bars .b i{display:block;width:100%;max-width:38px;border-radius:5px 5px 2px 2px;background:var(--pri);border:1px solid var(--pri-b);min-height:2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.bars .b span{font-family:var(--mono);font-size:.6rem;color:var(--tx2);white-space:nowrap}
.hbar{display:grid;grid-template-columns:120px 1fr 50px;gap:8px;align-items:center;font-size:.8rem;margin:5px 0}
.hbar .tr{height:12px;background:color-mix(in srgb,var(--tx3) 20%,transparent);border-radius:6px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--acc);border-radius:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* ---------- SETTINGS ---------- */
.set-wrap{max-width:860px;margin:0 auto}
.set-sec{margin-bottom:16px}
.set-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid color-mix(in srgb,var(--pan-b) 60%,transparent);min-height:56px;flex-wrap:wrap}
.set-row:first-child{border-top:0}
.set-row .lab{flex:1;min-width:180px}
.set-row .lab small{display:block;color:var(--tx2);font-size:.75rem;margin-top:2px}
.set-row .ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;padding:14px}
.skin{border:2px solid var(--pan-b);border-radius:12px;overflow:hidden;cursor:pointer;background:transparent;padding:0;text-align:left;color:var(--tx)}
.skin.on{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 30%,transparent)}
.skin .pv{height:74px;position:relative}
.skin .pv i{position:absolute;left:10px;right:10px;top:10px;height:12px;border-radius:4px}
.skin .pv b{position:absolute;left:10px;bottom:10px;width:46px;height:20px;border-radius:6px}
.skin .pv u{position:absolute;right:10px;bottom:10px;width:40px;height:20px;border-radius:4px}
.skin .nm{padding:7px 10px;font-size:.78rem;font-weight:700;background:var(--pan-s)}

/* ---------- MODALS / TOASTS / SHEETS ---------- */
#layer{position:fixed;inset:0;z-index:8000;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);pointer-events:auto;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .18s}
.dlg{width:min(480px,100%);max-height:calc(var(--vvh,100dvh) - 32px);animation:pop .22s var(--ease)}
.dlg.wide{width:min(760px,100%)}
.dlg .body{padding:18px;overflow:auto}
.foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--pan-b);flex-wrap:wrap;background:color-mix(in srgb,var(--pan-s) 60%,transparent)}
.dlg .msg{display:flex;gap:14px;align-items:flex-start}
.dlg .msg svg.i{width:36px;height:36px;flex:none;color:var(--acc)}
.dlg .msg.warn svg.i{color:var(--warn)}
.dlg .msg.dng svg.i{color:var(--dng)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}}
#toasts{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:calc(44px + env(safe-area-inset-bottom));z-index:8500;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;max-width:340px;display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:10px 10px 2px 10px;background:#ffffe1;color:#111;border:1px solid #8a8a6a;box-shadow:0 6px 18px rgba(0,0,0,.35);font-size:.84rem;animation:pop .25s var(--ease);font-family:var(--font);text-shadow:none}
[data-skin=graphite] .toast,[data-skin=amp] .toast,[data-skin=phosphor] .toast{background:#10161d;color:var(--tx);border-color:var(--acc);box-shadow:0 0 0 1px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5),0 0 18px color-mix(in srgb,var(--acc) 25%,transparent)}
.toast svg.i{color:var(--acc)}
.toast.err svg.i{color:var(--dng)}
.toast.ok svg.i{color:var(--ok)}
.toast b{display:block;margin-bottom:1px}
.menu{position:absolute;pointer-events:auto;min-width:220px;max-width:min(320px,calc(100vw - 20px));max-height:70vh;overflow:auto;padding:5px;animation:pop .16s var(--ease)}
.menu .mi{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:0 12px;border:0;border-radius:7px;background:transparent;color:var(--tx);text-align:left;font-size:.88rem}
.menu .mi:hover,.menu .mi:focus{background:var(--sel);color:var(--sel-t);outline:none}
.menu .mi.dng{color:var(--dng)}
.menu .mi .k{margin-left:auto;font-family:var(--mono);font-size:.7rem;opacity:.6}
.menu .mi.on::after{content:"✓";margin-left:auto;font-weight:700}
.menu hr{border:0;border-top:1px solid var(--pan-b);margin:4px 2px}
.menu .mh{font-family:var(--disp);font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--tx3);padding:8px 12px 4px}
.sheet .menu{position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));top:auto!important;max-width:none;min-width:0;animation:slideup .22s var(--ease)}
@keyframes slideup{from{transform:translateY(40px);opacity:0}}
.palette{width:min(620px,100%);align-self:flex-start;margin-top:10vh}
.palette .inp{border:0;border-radius:0;min-height:56px;font-size:18px;box-shadow:none;border-bottom:1px solid var(--pan-b);background:transparent}
.palette .res{max-height:52vh;overflow:auto;padding:5px}
.palette .mi .sub{font-size:.7rem;color:var(--tx3);margin-left:auto;font-family:var(--mono)}
.palette .mi.on{background:var(--sel);color:var(--sel-t)}
.palette .mi.on .sub{color:inherit}
.colors{display:grid;grid-template-columns:repeat(8,34px);gap:6px;padding:8px}
.colors button{width:34px;height:34px;border-radius:6px;border:1px solid rgba(0,0,0,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.emojis{display:grid;grid-template-columns:repeat(8,40px);gap:2px;padding:6px}
.emojis button{width:40px;height:40px;border:0;background:transparent;font-size:22px;border-radius:8px}
.emojis button:hover{background:var(--hov)}
.syntax td{padding:5px 8px;border-bottom:1px solid var(--pan-b);font-size:.8rem;vertical-align:top}
.syntax td:first-child{font-family:var(--mono);color:var(--acc);white-space:nowrap}
.revs{display:flex;flex-direction:column;gap:6px;max-height:45vh;overflow:auto}
.revs button{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:8px;border:1px solid var(--pan-b);background:var(--pan-s);color:var(--tx);text-align:left;min-height:44px}
.revs button.on{background:var(--sel);color:var(--sel-t)}
.revprev{max-height:40vh;overflow:auto;border:1px solid var(--pan-b);border-radius:8px;padding:12px;background:var(--paper);color:var(--paper-t);margin-top:10px;font-size:.9rem}

/* ---------- PRINT ---------- */
#print-root{display:none}
@media print{
  body{position:static;overflow:visible;background:#fff!important;color:#000}
  body>*:not(#print-root){display:none!important}
  #print-root{display:block;--paper:#fff;--paper-t:#000;--paper-b:#ccc;--acc:#0645ad;font-family:Georgia,serif;padding:0 10mm}
  #print-root h1.pt{font-size:24pt;margin:0 0 4pt}
  #print-root .pm{font-size:9pt;color:#555;margin-bottom:14pt;font-family:monospace}
  .rich pre{background:#f4f4f4;color:#000;border-color:#ccc}
}

/* ---------- RESPONSIVE ---------- */
.only-narrow,.only-drawer{display:none!important}
@media (max-width:1180px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:7000;width:min(300px,84vw);border-radius:0 var(--r) var(--r) 0;transform:translateX(-105%);transition:transform .28s var(--ease);padding-top:env(safe-area-inset-top)}
  .drawer-open .sidebar{transform:none}
  .drawer-open .drawer-scrim{display:block}
  .only-drawer{display:inline-flex!important}
  .listpane{width:310px}
}
@media (max-width:900px){.lg-split{grid-template-columns:1fr;gap:18px}.lg-div{display:none}.lg-brand{text-align:center}.wordmark{font-size:2.3rem;margin-right:-.42em}.lg-users{max-height:none}}
.drawer-scrim{display:none;position:fixed;inset:0;z-index:6990;background:rgba(0,0,0,.4);backdrop-filter:blur(2px)}
@media (max-width:700px){
  .listpane{width:auto;flex:1}
  .content.show-detail .listpane{display:none}
  .content:not(.show-detail) .detail.pd{display:none}
  .only-narrow{display:inline-flex!important}
  .hide-narrow{display:none!important}
  .jr-wrap{grid-template-columns:1fr;padding:12px}
  .ed-paper{padding:18px 18px 40vh}
  .lg-split{grid-template-columns:1fr;gap:18px}
  .lg-div{display:none}
  .lg-brand{text-align:center}
  .wordmark{font-size:2.2rem}
  .two{grid-template-columns:1fr}
  .crumb{display:none}
}
@media (max-width:520px){
  .titlebar .lcd.clock{display:none}
  .statusbar .cell.opt{display:none}
  .hbar{grid-template-columns:90px 1fr 40px}
}
@media (pointer:coarse){
  .prow{min-height:64px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.reduce *{animation:none!important;transition:none!important}

/* ============================================================
   v3 — touch, feel & polish
   ============================================================ */
/* ripples + press physics */
.btn,.nitem,.mi,.utile,.skin,.seg button,.chip.tg{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;pointer-events:none;background:currentColor;opacity:.22;transform:scale(0);animation:rip .6s cubic-bezier(.2,.7,.3,1) forwards;z-index:0}
@keyframes rip{to{transform:scale(1);opacity:0}}
.btn{transition:filter .15s,transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .15s}
.btn:active{transform:scale(.95)}
.btn.on:active{transform:scale(.95)}
.nitem{transition:background .15s,transform .18s cubic-bezier(.3,1.6,.5,1)}
.nitem:active{transform:scale(.97)}
.prow:active{transform:scale(.985)}
.nofx .rip{display:none}
/* trash lid */
svg.i .lid{transform-box:view-box;transform-origin:20.5px 6.5px;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.btn:hover svg.i .lid,.nitem:hover svg.i .lid,.mi:hover svg.i .lid,.rowwrap.swiping .rowbg .r svg.i .lid,.bulkbar .dng:active svg.i .lid{transform:rotate(-22deg) translate(1px,-1px)}
.nitem .ni-full svg.i{color:var(--warn)}
/* view transitions */
.fx .content>.panel{animation:viewIn .34s var(--ease) both}
.fx .content>.panel+.panel{animation-delay:.04s}
@keyframes viewIn{from{opacity:0;transform:translateY(12px) scale(.992)}}
.fx .prow.in{animation:rowIn .38s var(--ease) both;animation-delay:calc(var(--i,0) * 24ms)}
@keyframes rowIn{from{opacity:0;transform:translateX(-10px)}}
/* toasts */
.toast{animation:toastIn .34s cubic-bezier(.3,1.4,.5,1);touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .25s,opacity .25s}
.toast.out{transform:translateX(120%);opacity:0}
@keyframes toastIn{from{transform:translateX(60px) scale(.96);opacity:0}}
/* confetti */
.conf{position:fixed;z-index:9900;width:7px;height:12px;border-radius:2px;pointer-events:none;animation:conf 1.5s cubic-bezier(.15,.6,.35,1) forwards}
@keyframes conf{35%{transform:translate(var(--dx),var(--dy)) rotate(calc(var(--r) * .4))}100%{transform:translate(calc(var(--dx) * 1.25),calc(var(--dy) + 340px)) rotate(var(--r));opacity:0}}
/* bottom-sheet dialogs (narrow) */
.scrim.as-sheet{align-items:flex-end;padding:0}
.as-sheet .dlg{width:100%;max-width:none;border-radius:20px 20px 0 0;max-height:92vh;animation:sheetUp .32s cubic-bezier(.2,.9,.3,1);transition:transform .22s var(--ease);padding-bottom:env(safe-area-inset-bottom)}
@keyframes sheetUp{from{transform:translateY(100%)}}
.grab{width:42px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--tx) 30%,transparent);margin:8px auto 2px;flex:none;touch-action:none;cursor:grab}
.as-sheet .tbar{touch-action:none}
/* touch sizing */
@media (pointer:coarse){
  :root{--tap:48px}
  .nitem{min-height:48px;font-size:.92rem}
  .ed-tb .btn{min-height:46px;min-width:46px}
  .ed-tb .btn.ico{width:46px}
  .ed-tb select.inp{min-height:46px}
  .tbar .btn{min-height:38px;min-width:38px}
  .titlebar .btn{min-height:46px;min-width:46px}
  .menu .mi{min-height:50px;font-size:.95rem}
  .chip{min-height:34px}
  .btn.sm{min-height:40px;min-width:40px}
  .btn.sm.ico{width:40px}
  .set-row{min-height:64px}
  .cal button{min-height:38px}
  .floatbar .btn{min-height:44px;min-width:44px}
  ::-webkit-scrollbar{width:4px;height:4px}

/* menus: anchored popover on wide screens, bottom sheet on narrow */
function menu(items, anchor, opts = {}) {
  return new Promise(resolve => {
    const scrim = document.createElement('div');
    scrim.style.cssText = 'position:absolute;inset:0;pointer-events:auto';
    const sheet = narrow() || opts.sheet;

    const m = document.createElement('div');
    m.className = 'panel menu';
    m.innerHTML = items.map((it, i) => {
      if (it === '-') return '<hr>';
      if (it.head) return `<div class="mh">${esc(it.head)}</div>`;
      if (it.html) return it.html;
      return `<button class="mi ${it.kind || ''} ${it.on ? 'on' : ''}" data-i="${i}">${it.ico ? icon(it.ico, 'sm') : ''}<span>${esc(it.label)}</span>${it.k ? `<span class="k">${esc(it.k)}</span>` : ''}</button>`;
    }).join('');
    scrim.appendChild(m);
    layerEl().appendChild(scrim);
    let done = false;
    const entry = { close };
    Layer.stack.push(entry);
    function close(v) { if (done) return; done = true; Layer.stack = Layer.stack.filter(x => x !== entry); scrim.remove(); resolve(v); }
    if (!sheet) {
      let x, y;
      if (anchor && anchor.getBoundingClientRect) { const r = anchor.getBoundingClientRect(); x = r.left; y = r.bottom + 4; }
      else if (anchor && anchor.x != null) { x = anchor.x; y = anchor.y; }

      m.style.left = x + 'px'; m.style.top = y + 'px';
      requestAnimationFrame(() => {
        const r = m.getBoundingClientRect();
        if (r.right > innerWidth - 8) m.style.left = Math.max(8, innerWidth - r.width - 8) + 'px';
        if (r.bottom > innerHeight - 8) m.style.top = Math.max(8, (anchor?.getBoundingClientRect ? anchor.getBoundingClientRect().top - r.height - 4 : innerHeight - r.height - 8)) + 'px';
      });
    }
    scrim.addEventListener('pointerdown', e => { if (e.target === scrim) { e.preventDefault(); close(null); } });
    m.addEventListener('click', e => {
      const b = e.target.closest('[data-i]'); if (!b) return;
      const it = items[+b.dataset.i]; Snd.click();
      close(it.val !== undefined ? it.val : it.label);
      if (it.run) it.run();
    });
    if (opts.onOpen) opts.onOpen(m, close);
  });
}

}

  for (let si = 0; si < s.length && qi < q.length; si++) if (s[si] === q[qi]) { score += last === si - 1 ? 3 : 1; last = si; qi++; }

}

  async exportBackup(posts, password, { prefs = true } = {}) {

      await this.savePrefs();
    }

      <div class="lg-brand"><div class="bigclock" id="bigclock">--:--</div><div class="bigdate" id="bigdate"></div><div class="row lg-mark">${logo(52, 'glow')}<div class="wordmark" style="margin:0">Quill</div></div><div class="tag">${V.global.hideUsers ? 'Enter your handle and password' : 'To begin, tap your handle'}</div></div>

      <div class="u-form"><div class="inp-wrap grow"><input class="inp" type="password" id="hp" placeholder="Password" autocomplete="current-password"></div><button class="go" id="hgo" aria-label="Log on">${icon('chevr')}</button></div>
      <div class="u-msg" id="hmsg"></div></div>`;
    const go = async () => {

      if (!a) { await kdf(pw, rnd(16), KDF_ITER); return loginFail($('#hmsg'), 'Unknown handle or wrong password.', $('#hp')); }

    box.onclick = e => { const t = e.target.closest('.utile'); if (!t || e.target.closest('.slot')) return; openTile(accts.find(a => a.id === t.dataset.id)); };
    box.onkeydown = e => { if (e.key === 'Enter' && e.target.classList.contains('utile')) openTile(accts.find(a => a.id === e.target.dataset.id)); };
    const pre = accts.find(a => a.id === V.global.lastUser) || (accts.length === 1 ? accts[0] : null);

  if (msg) toast(msg, 'lock');
}

function openTile(acct, forcePw = false) {
  $$('.utile').forEach(t => { t.classList.toggle('open', t.dataset.id === acct.id); $('.slot', t).innerHTML = ''; });
  const tile = $(`.utile[data-id="${acct.id}"]`); if (!tile) return;
  const slot = $('.slot', tile);
  const pinOK = acct.pin && !(acct.pin.exp && Date.now() > acct.pin.exp) && !forcePw;
  Login.pinBuf = '';
  if (pinOK) {
    const n = acct.pin.len || 6;
    slot.innerHTML = `<div class="pindots" id="pdots">${'<i></i>'.repeat(n)}</div>
      <div class="pinpad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(d => `<button class="btn" data-d="${d}">${d}</button>`).join('')}<button class="btn" data-d="bk" aria-label="Backspace">⌫</button><button class="btn" data-d="0">0</button><button class="btn pri" data-d="ok" aria-label="Unlock">${icon('check')}</button></div>
      <div class="u-msg" id="umsg"></div>
      <div class="u-links"><button class="btn ghost" data-a="pw">${icon('key', 'sm')} Use password</button></div>`;
    const dots = () => $$('#pdots i').forEach((d, i) => d.classList.toggle('f', i < Login.pinBuf.length));
    const submit = async () => {
      if (Login.pinBuf.length < 4) return;
      const m = $('#umsg'); m.className = 'u-msg'; m.textContent = 'Verifying…';
      try { const missed = await V.unlockPin(acct, Login.pinBuf); enterApp(missed); }
      catch (e) {
        Login.pinBuf = ''; dots();
        if (e.code === 'badpin') loginFail(m, `Wrong PIN. ${e.left} attempt${e.left === 1 ? '' : 's'} left before the PIN is erased.`, $('#pdots'));
        else { toast(e.code === 'pinwiped' ? 'Too many wrong PINs — PIN erased. Use your password.' : 'PIN expired — please use your password.', 'err'); openTile(acct, true); }
      }
    };
    slot.querySelector('.pinpad').onclick = e => {
      const b = e.target.closest('[data-d]'); if (!b) return; Snd.key();
      const d = b.dataset.d;
      if (d === 'bk') Login.pinBuf = Login.pinBuf.slice(0, -1);
      else if (d === 'ok') return submit();
      else if (Login.pinBuf.length < 8) { Login.pinBuf += d; haptic(5); }
      dots(); if (Login.pinBuf.length === n) submit();
    };
    Login.pinKey = e => {
      if (/^\d$/.test(e.key)) $(`.pinpad [data-d="${e.key}"]`).click();
      else if (e.key === 'Backspace') $('.pinpad [data-d="bk"]').click(); else if (e.key === 'Enter') submit();
    };
    if (!Login._kh) { Login._kh = true; document.addEventListener('keydown', e => { if ($('#pdots') && !Layer.stack.length && Login.pinKey) Login.pinKey(e); }); }
  } else {
    slot.innerHTML = `<div class="u-form"><div class="inp-wrap grow"><input class="inp" type="password" id="upw" placeholder="Password" autocomplete="current-password"><button class="btn ico ghost peek" data-a="peek" aria-label="Show password">${icon('eye', 'sm')}</button></div><button class="go" data-a="go" aria-label="Log on">${icon('chevr')}</button></div>
      <div class="u-msg" id="umsg"></div>
      <div class="u-links">${acct.hint ? `<button class="btn ghost" data-a="hint">${icon('info', 'sm')} Hint</button>` : ''}<button class="btn ghost" data-a="forgot">${icon('key', 'sm')} Forgot password?</button></div>`;
    const inp = $('#upw');
    setTimeout(() => inp.focus(), 80);
    inp.onkeydown = e => { if (e.key === 'Enter') tryPassword(acct, inp.value, $('#umsg'), inp); };
    throttleTick(acct);
  }
  slot.onclick = e => {
    const a = e.target.closest('[data-a]')?.dataset.a; if (!a) return;
    if (a === 'go') tryPassword(acct, $('#upw').value, $('#umsg'), $('#upw'));
    if (a === 'peek') { const i = $('#upw'); i.type = i.type === 'password' ? 'text' : 'password'; }
    if (a === 'hint') alertD(`<b>Password hint:</b><br>${esc(acct.hint)}`, 'Hint');
    if (a === 'forgot') recoverFlow(acct);
    if (a === 'pw') openTile(acct, true);
  };
}
function throttleTick(acct) {
  const m = $('#umsg'); if (!m) return;
  const w = V.throttled(acct);
  if (w > 0) { m.className = 'u-msg err'; m.innerHTML = `Locked out after failed attempts. Retry in <span class="lcd">${pad(Math.floor(w / 60000))}:${pad(Math.ceil(w / 1000) % 60)}</span>`; setTimeout(() => throttleTick(acct), 1000); }
  else if (m.textContent.startsWith('Locked out')) { m.className = 'u-msg'; m.textContent = ''; }
}
function loginFail(m, text, shakeEl) {
  m.className = 'u-msg err'; m.textContent = text; Snd.err(); haptic([30, 40, 30]);
  if (shakeEl) { shakeEl.classList.remove('shake'); void shakeEl.offsetWidth; shakeEl.classList.add('shake'); if (shakeEl.select) shakeEl.select(); }
}
async function tryPassword(acct, pw, m, inp) {
  if (!pw) return;
  m.className = 'u-msg'; m.innerHTML = `<span class="lcd">DERIVING KEY · PBKDF2 ×${(acct.kdf.iter / 1000) | 0}k</span>`;
  await sleep(20);
  try { const missed = await V.unlockPassword(acct, pw); enterApp(missed); }
  catch (e) {
    if (e.code === 'wiped') { await alertD('Too many failed attempts. Per this vault\'s self-destruct setting, it has been <b>permanently erased</b>.', 'Vault erased', 'warn', 'dng'); return renderLogin(); }
    if (e.code === 'throttle') return throttleTick(acct);
    loginFail(m, 'Incorrect password.' + (e.fails >= 3 ? '' : ''), inp);
    if (e.wait) throttleTick(acct);
  }
}

/* ---------- recovery ---------- */
async function recoverFlow(acct) {
  const body = frag(`<div class="note info">Enter the recovery key you saved when the vault was created. You will then choose a new password. Your quick-unlock PIN will be removed.</div>
    <div class="field"><label>Recovery key</label><input class="inp mono" id="rk" placeholder="QUILL-XXXX-XXXX-…" autocomplete="off" autocapitalize="characters" spellcheck="false"></div>
    <div class="field"><label>New password</label><input class="inp" type="password" id="rp1" autocomplete="new-password"><div class="meter" id="rmeter"><i></i><i></i><i></i><i></i></div></div>
    <div class="field"><label>Confirm new password</label><input class="inp" type="password" id="rp2" autocomplete="new-password"></div><div class="u-msg err" id="rmsg"></div>`);
  let busy = false;
  const ok = await dlg({
    title: 'Vault recovery — ' + acct.handle, body,
    onOpen(w) { $('#rp1', w).oninput = () => { $('#rmeter', w).className = 'meter s' + pwStrength($('#rp1', w).value).score; }; },
    buttons: [{ label: 'Cancel', val: false }, {
      label: 'Recover vault', kind: 'pri', ico: 'key', val: true,
      validate: async w => {
        if (busy) return false;
        const k = $('#rk', w).value, p1 = $('#rp1', w).value, p2 = $('#rp2', w).value, m = $('#rmsg', w);
        if (normRec(k).length !== 32) { m.textContent = 'Recovery keys are 32 characters (after QUILL-).'; return false; }
        if (p1.length < 8) { m.textContent = 'New password must be at least 8 characters.'; return false; }
        if (p1 !== p2) { m.textContent = 'Passwords do not match.'; return false; }
        busy = true; m.className = 'u-msg'; m.textContent = 'Unwrapping vault key…';
        try { await V.recover(acct, k, p1); return true; } catch (e) { m.className = 'u-msg err'; m.textContent = e.message; busy = false; Snd.err(); return false; }
      },
    }],
  });
  if (ok) { toast('Password reset. Consider generating a new recovery key in Settings → Security.', 'ok', 5000, 'Vault recovered'); enterApp(0); }
}

/* ---------- setup wizard ---------- */
async function setupWizard(first = false, restore = null) {
  const mid = $('#lgmid');
  const st = { step: 1, handle: restore?.handle || '', avatar: restore?.avatar ?? Math.floor(Math.random() * AVATARS.length), pw: '', hint: '', rec: '' };
  const existing = await V.accounts();
  const render = () => {
    const S = st.step;
    let body = '';
    if (S === 1) body = `
      ${first ? `<div style="text-align:center;margin-bottom:14px">${logo(84, 'glow float')}<div class="wordmark" style="font-size:2rem;margin:12px 0 6px;margin-right:-.42em">Quill</div><div class="dim">Your private, encrypted blog. Nothing ever leaves this device.</div></div>` : ''}
      ${restore ? '<div class="note info">Backup decrypted. Create a vault on this device to hold it.</div>' : ''}
      <div class="field"><label>Choose a handle</label><input class="inp" id="wh" maxlength="32" value="${esc(st.handle)}" placeholder="e.g. neo, quillmaster, ajay" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
      <div class="field"><label>Buddy icon</label><div class="avgrid">${AVATARS.map((a, i) => `<button data-av="${i}" class="${i === st.avatar ? 'on' : ''}" aria-label="Avatar ${i + 1}">${avatarHTML(i)}</button>`).join('')}</div></div>
      <div class="u-msg err" id="wmsg"></div>`;
    if (S === 2) body = `
      <div class="field"><label>Master password</label><div class="inp-wrap"><input class="inp" type="password" id="wp1" autocomplete="new-password" placeholder="Long passphrases beat clever symbols"><button class="btn ico ghost peek" id="wpeek">${icon('eye', 'sm')}</button></div>
        <div class="meter" id="wmeter"><i></i><i></i><i></i><i></i></div>
        <div class="row" style="justify-content:space-between;font-size:.75rem"><span class="lcd" id="wlab">— · 0 BITS</span><span class="dim" id="wcrack"></span></div></div>
      <div class="field"><label>Confirm password</label><input class="inp" type="password" id="wp2" autocomplete="new-password"></div>
      <div class="field"><label>Password hint <span class="faint">(optional — stored unencrypted, keep it vague)</span></label><input class="inp" id="whint" maxlength="80" value="${esc(st.hint)}"></div>
      <div class="note">There is no server and no reset link. If you forget your password <i>and</i> lose your recovery key, your entries are unrecoverable — that's the point.</div>
      <div class="u-msg err" id="wmsg"></div>`;
    if (S === 3) body = `
      <div class="note info">${icon('key', 'sm')} This recovery key can unlock your vault if you forget your password. Store it offline — print it, write it down, or put it in a password manager. It will not be shown again.</div>
      <div class="lcd big reckey" id="wrec">${esc(st.rec)}</div>
      <div class="row wrap" style="margin:12px 0;justify-content:center"><button class="btn" id="wcopy">${icon('copy')}Copy</button><button class="btn" id="wsave">${icon('download')}Save as .txt</button></div>
      <label class="check"><input type="checkbox" id="wack"><span class="tog"></span><span>I've stored my recovery key somewhere safe</span></label>`;
    if (S === 4) body = `
      <div class="note info">Optional quick unlock: a 4–8 digit PIN for fast access on this tablet. PINs are attempt-limited (5 tries, then erased) and expire, after which your full password is required.</div>
      <div class="field"><label>PIN</label><input class="inp mono" id="wpin1" inputmode="numeric" pattern="[0-9]*" maxlength="8" type="password" autocomplete="off"></div>
      <div class="field"><label>Confirm PIN</label><input class="inp mono" id="wpin2" inputmode="numeric" pattern="[0-9]*" maxlength="8" type="password" autocomplete="off"></div>
      <div class="field"><label>Require full password every</label><select class="inp" id="wpinexp"><option value="24">Day</option><option value="168" selected>Week</option><option value="720">30 days</option><option value="0">Never (less secure)</option></select></div>
      <div class="u-msg err" id="wmsg"></div>`;
    mid.innerHTML = `<div class="panel win"><div class="tbar"><span class="led"></span><span class="ttl grow">${restore ? 'Restore backup' : first ? 'Welcome to Quill' : 'New vault'} — step ${S} of 4</span>${!first && S < 3 ? `<button class="btn ico sm" id="wx">${icon('close', 'sm')}</button>` : ''}</div>
      <div class="body"><div class="steps">${[1, 2, 3, 4].map(i => `<i class="${i <= S ? 'on' : ''}"></i>`).join('')}</div>${body}</div>
      <div class="foot">${S === 2 ? `<button class="btn" id="wback">${icon('back')}Back</button>` : ''}${S === 4 ? '<button class="btn" id="wskip">Skip</button>' : ''}<button class="btn pri" id="wnext">${S === 2 ? 'Forge keys' : S === 4 ? 'Set PIN & enter' : 'Next'}${icon('chevr')}</button></div></div>`;
    wire();
  };
  const wire = () => {
    const S = st.step, m = $('#wmsg');
    $('#wx') && ($('#wx').onclick = () => renderLogin());
    $('#wback') && ($('#wback').onclick = () => { st.step = 1; render(); });
    if (S === 1) {
      $('.avgrid').onclick = e => { const b = e.target.closest('[data-av]'); if (!b) return; st.avatar = +b.dataset.av; $$('.avgrid button').forEach(x => x.classList.toggle('on', x === b)); Snd.click(); };
      setTimeout(() => $('#wh')?.focus(), 80);
      $('#wh').onkeydown = e => { if (e.key === 'Enter') $('#wnext').click(); };
      $('#wnext').onclick = () => {
        const h = $('#wh').value.trim();
        if (h.length < 2) return m.textContent = 'Handle needs at least 2 characters.';
        if (existing.some(a => a.handle.toLowerCase() === h.toLowerCase())) return m.textContent = 'That handle is already used on this device.';
        st.handle = h; st.step = 2; render();
      };
    }
    if (S === 2) {
      const p1 = $('#wp1'), upd = () => { const s = pwStrength(p1.value); $('#wmeter').className = 'meter s' + s.score; $('#wlab').textContent = `${s.label} · ${s.bits} BITS`; $('#wcrack').textContent = p1.value ? 'offline crack: ' + s.crack : ''; };
      p1.oninput = upd; setTimeout(() => p1.focus(), 80);
      $('#wpeek').onclick = () => { p1.type = $('#wp2').type = p1.type === 'password' ? 'text' : 'password'; };
      $('#wnext').onclick = async () => {
        const a = p1.value, b = $('#wp2').value, s = pwStrength(a);
        if (a.length < 8) return m.textContent = 'Use at least 8 characters.';
        if (a !== b) return m.textContent = 'Passwords do not match.';
        if (s.score < 2 && !(await confirmD('This password is weak and could be cracked quickly if someone copies your device data. Use it anyway?', { ok: 'Use anyway' }))) return;
        st.pw = a; st.hint = $('#whint').value.trim();
        if (st.hint && a.toLowerCase().includes(st.hint.toLowerCase())) return m.textContent = 'Your hint must not contain the password.';
        $('#wnext').disabled = true; m.className = 'u-msg'; m.innerHTML = '<span class="lcd">GENERATING 256-BIT KEY · WRAPPING · PBKDF2 ×600k</span>';
        try { st.rec = await V.create({ handle: st.handle, avatar: st.avatar, password: a, hint: st.hint }); }
        catch (e) { m.className = 'u-msg err'; m.textContent = 'Key generation failed: ' + e.message; $('#wnext').disabled = false; return; }
        if (restore) { try { await V.importPayload(restore, 'merge'); } catch (e) { toast('Import failed: ' + e.message, 'err'); } }
        st.step = 3; render(); Snd.ok();
      };
    }
    if (S === 3) {
      $('#wcopy').onclick = () => copyText(st.rec, true);
      $('#wsave').onclick = () => saveFile(`quill-recovery-${st.handle}.txt`, `QUILL RECOVERY KEY\n==================\nHandle:  ${st.handle}\nCreated: ${new Date().toString()}\n\n${st.rec}\n\nKeep this offline. Anyone with this key AND your device data can read your vault.\n`, 'text/plain');
      $('#wnext').onclick = () => { if (!$('#wack').checked) { toast('Please confirm you saved the recovery key.', 'err'); return; } st.step = 4; render(); };
    }
    if (S === 4) {
      setTimeout(() => $('#wpin1')?.focus(), 80);
      $('#wskip').onclick = () => { st.pw = ''; enterApp(0, true); };
      $('#wnext').onclick = async () => {
        const a = $('#wpin1').value, b = $('#wpin2').value;
        if (!/^\d{4,8}$/.test(a)) return m.textContent = 'PIN must be 4–8 digits.';
        if (a !== b) return m.textContent = 'PINs do not match.';
        if (/^(\d)\1+$/.test(a) || '0123456789'.includes(a) || '9876543210'.includes(a)) return m.textContent = 'Too guessable — avoid repeats and sequences.';
        $('#wnext').disabled = true; m.className = 'u-msg'; m.textContent = 'Wrapping key with PIN…';
        await V.setPin(st.pw, a, +$('#wpinexp').value); st.pw = '';
        enterApp(0, true);
      };
    }
  };
  render();
}

async function restoreFlow() {
  const [f] = await pickFiles('.json,.quill,application/json'); if (!f) return;
  let j; try { j = V.parseBackupFile(await f.text()); } catch (e) { return alertD(esc(e.message), 'Restore', 'warn', 'warn'); }
  const payload = await dlg({
    title: 'Decrypt backup', enterVal: true,
    body: `<div class="note info">${esc(f.name)} · ${fmtBytes(f.size)} · ${esc(j.cipher || 'AES-256-GCM')} / ${esc(j.kdf.alg)} ×${(+j.kdf.iter).toLocaleString()}</div><div class="field"><label>Backup password</label><input class="inp" type="password" id="bp" autofocus></div><div class="u-msg err" id="bm"></div>`,
    buttons: [{ label: 'Cancel', val: null }, {
      label: 'Decrypt', kind: 'pri', ico: 'unlock', val: w => w._payload,
      validate: async w => { const m = $('#bm', w); m.className = 'u-msg'; m.textContent = 'Deriving key…'; try { w._payload = await V.decryptBackup(j, $('#bp', w).value); return true; } catch (e) { m.className = 'u-msg err'; m.textContent = e.message; Snd.err(); return false; } },
    }],
  });
  if (!payload) return;
  toast(`${plural(payload.posts.length, 'entry')} decrypted from backup`, 'ok');
  setupWizard(false, payload);
}

async function securityInfo(inApp = true) {
  const fp = inApp && V.acct ? await V.fingerprint() : null;
  return dlg({
    title: 'Security model', wide: true,
    body: `<table class="syntax" style="width:100%;border-collapse:collapse">
      <tr><td>Encryption</td><td>AES-256-GCM with a random 96-bit IV per write. Each record's ciphertext is bound to its vault and record ID (AAD), so blocks can't be swapped or replayed between entries.</td></tr>
      <tr><td>Keys</td><td>A random 256-bit vault key encrypts everything. It is itself wrapped by keys derived from your password (PBKDF2-SHA256, 600,000 iterations), your recovery key, and optionally your PIN. Changing your password re-wraps the key without re-encrypting entries.</td></tr>
      <tr><td>What's encrypted</td><td>Titles, bodies, tags, categories, mood, music, dates, revisions, images, settings. Only the handle, buddy icon and optional hint are visible before login.</td></tr>
      <tr><td>Backups</td><td>Exports are a single JSON file encrypted with AES-256-GCM under a password you choose; nothing readable is stored in the file's plain fields.</td></tr>
      <tr><td>Network</td><td>A Content-Security-Policy blocks all network connections (connect-src 'none'). Quill cannot phone home, load trackers, or fetch remote images.</td></tr>
      <tr><td>Session</td><td>Auto-lock on idle, lock when hidden, privacy shield in the app switcher. Locking drops the key from memory and revokes decrypted image URLs.</td></tr>
      <tr><td>Limits</td><td>Lockouts, PIN attempt limits and self-destruct run inside the app; someone who copies raw browser data can attack the password offline, which is why its strength matters. A PIN is convenience, not strength.</td></tr>
      ${fp ? `<tr><td>Key fingerprint</td><td class="mono">${fp}</td></tr>` : ''}
    </table>`,
    buttons: [{ label: 'Close', val: true, kind: 'pri' }],

function basePred(p) {
  const f = S.filter;
  if (f.k === 'trash') return !!p.trashed;
  if (p.trashed) return false;
  switch (f.k) {
    case 'starred': return p.starred; case 'pinned': return p.pinned; case 'drafts': return p.status === 'draft'; case 'posted': return p.status === 'posted';
    case 'cat': return (p.category || '') === (f.v || ''); case 'tag': return p.tags.includes(f.v);
    case 'month': return monthKey(p.created) === f.v; case 'day': return dayKey(p.created) === f.v;
    default: return true;
  }
}
function results(extraQ = '') {
  const smart = S.filter.k === 'smart' ? (V.prefs.smart.find(s => s.id === S.filter.v) || {}).q || '' : '';
  const terms = parseQuery([smart, S.q, extraQ].filter(Boolean).join(' '));
  const wantTrash = terms.some(t => t.field === 'is' && /^(trash|trashed|deleted)$/.test(t.val) && !t.neg);
  let arr = [...V.posts.values()].filter(p => (wantTrash ? true : basePred(p)) && matchQuery(terms, p));
  const P = V.prefs, dir = P.dir === 'asc' ? 1 : -1;
  const sc = new Map(); if (P.sort === 'relevance') arr.forEach(p => sc.set(p.id, scorePost(terms, p)));
  const cmp = {
    updated: (a, b) => a.updated - b.updated, created: (a, b) => a.created - b.created,
    title: (a, b) => (a.title || '￿').localeCompare(b.title || '￿', undefined, { numeric: true, sensitivity: 'base' }) * -1,
    words: (a, b) => a.words - b.words, relevance: (a, b) => (sc.get(a.id) - sc.get(b.id)) || a.updated - b.updated,
  }[P.sort] || ((a, b) => a.updated - b.updated);
  arr.sort((a, b) => cmp(a, b) * dir);
  if (P.pinTop && S.filter.k !== 'trash') arr.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
  return { arr, terms };
}

  if (d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth()) return 'Earlier this month';

}
