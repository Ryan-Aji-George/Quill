/* touch: tap / swipe-to-star / swipe-to-trash / long-press menu */
function bindListGestures(el) {
  let st = null, suppress = false;
  el.addEventListener('pointerdown', e => {
    const row = e.target.closest('.prow'); if (!row || e.button > 0) return;
    st = { row, wrap: row.parentElement, id: row.parentElement.dataset.id, x: e.clientX, y: e.clientY, mode: null, pid: e.pointerId, touch: e.pointerType !== 'mouse' };
    st.lp = setTimeout(() => { if (st && !st.mode) { st.mode = 'long'; suppress = true; navigator.vibrate?.(12); postMenu(st.id, { x: st.x, y: st.y }); } }, 520);
  });
  el.addEventListener('pointermove', e => {
    if (!st || e.pointerId !== st.pid) return;
    const dx = e.clientX - st.x, dy = e.clientY - st.y;
    if (!st.mode) {
      if (Math.abs(dy) > 10) { clearTimeout(st.lp); st = null; return; }
      if (st.touch && Math.abs(dx) > 14 && Math.abs(dx) > Math.abs(dy) * 1.5 && V.prefs.listView !== 'cards') { st.mode = 'swipe'; clearTimeout(st.lp); st.wrap.classList.add('swiping'); try { st.row.setPointerCapture(e.pointerId); } catch { } st.row.style.transition = 'none'; }
    }
    if (st.mode === 'swipe') {
      st.dx = clamp(dx, -150, 150) * (Math.abs(dx) > 110 ? .9 : 1); st.row.style.transform = `translateX(${st.dx}px)`;
      const armed = Math.abs(st.dx) > 90; if (armed !== !!st.armed) { st.armed = armed; if (armed) haptic(9); st.wrap.classList.toggle('armed', armed); }
    }
  });
  const end = async e => {
    if (!st) return; clearTimeout(st.lp);
    const s = st; st = null;
    if (s.mode === 'swipe') {
      suppress = true; s.row.style.transition = ''; s.row.style.transform = ''; setTimeout(() => s.wrap.classList.remove('swiping'), 260);
      const p = V.posts.get(s.id); if (!p) return;
      if (s.dx > 90) { p.starred = !p.starred; await V.savePost(p); toast(p.starred ? 'Starred ★' : 'Unstarred', 'ok', 1400); Snd.ok(); haptic(14); refreshAfterChange(); }
      else if (s.dx < -90) { if (p.trashed) await restorePosts([s.id]); else await trashPosts([s.id]); }
    }
    setTimeout(() => suppress = false, 50);
  };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  el.addEventListener('click', e => {
    if (suppress) { e.preventDefault(); return; }
    const w = e.target.closest('.rowwrap'); if (!w) return;
    const id = w.dataset.id;
    if (S.selMode || e.shiftKey || e.metaKey || e.ctrlKey) { if (!S.selMode) { S.selMode = true; $('#lp').classList.add('selmode'); } S.picked.has(id) ? S.picked.delete(id) : S.picked.add(id); w.querySelector('.prow').classList.toggle('picked', S.picked.has(id)); renderBulk(); return; }
    openPost(id);
  });
  el.addEventListener('contextmenu', e => { const w = e.target.closest('.rowwrap'); if (!w) return; e.preventDefault(); if (!isTouch()) postMenu(w.dataset.id, { x: e.clientX, y: e.clientY }); });
  el.addEventListener('keydown', e => {
    const r = e.target.closest('.prow'); if (!r) return;
    if (e.key === 'Enter') openPost(r.parentElement.dataset.id);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const rows = $$('.prow', el); const i = rows.indexOf(r) + (e.key === 'ArrowDown' ? 1 : -1); rows[clamp(i, 0, rows.length - 1)].focus(); }
    if (e.key === 'Delete') trashPosts([r.parentElement.dataset.id]);
  });
}

}

function markActivity() { Sess.last = Date.now(); }
function onVisibility() {
  if (document.hidden) {
    Sess.hiddenAt = Date.now();

    if (V.unlocked) { Editor.flush(); if (V.prefs.lockOnHide && +V.prefs.hideGrace === 0) lock('Locked when app was hidden'); }
  } else {

async function compressImage(file) {

  let bmp;
  try { bmp = await createImageBitmap(file); } catch { const u = URL.createObjectURL(file); bmp = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = u; }); }

function htmlToMd(p) {
  const d = new DOMParser().parseFromString(`<body>${p.html}</body>`, 'text/html');
  const walk = (n, ctx = {}) => [...n.childNodes].map(c => {
    if (c.nodeType === 3) return c.data.replace(/\u200b/g, '');
    if (c.nodeType !== 1) return '';
    const t = c.tagName, inner = () => walk(c, ctx);
    switch (t) {
      case 'H1': return `\n# ${inner()}\n\n`; case 'H2': return `\n## ${inner()}\n\n`; case 'H3': return `\n### ${inner()}\n\n`;
      case 'P': case 'DIV': return `${inner()}\n\n`; case 'BR': return '  \n';
      case 'B': case 'STRONG': return `**${inner()}**`; case 'I': case 'EM': return `*${inner()}*`; case 'S': case 'STRIKE': case 'DEL': return `~~${inner()}~~`;
      case 'CODE': return ctx.pre ? inner() : '`' + inner() + '`'; case 'PRE': return '\n```\n' + walk(c, { pre: true }) + '\n```\n\n';
      case 'BLOCKQUOTE': return inner().trim().split('\n').map(l => '> ' + l).join('\n') + '\n\n';
      case 'A': return `[${inner()}](${c.getAttribute('href')})`; case 'HR': return '\n---\n\n'; case 'IMG': return `![${c.alt || 'image'}](quill-asset:${c.dataset.asset})`;
      case 'UL': case 'OL': return [...c.children].map((li, i) => (t === 'OL' ? `${i + 1}. ` : '- ') + (c.classList.contains('checklist') ? `[${li.dataset.checked === 'true' ? 'x' : ' '}] ` : '') + walk(li, ctx).trim()).join('\n') + '\n\n';
      case 'TABLE': { const rows = [...c.querySelectorAll('tr')].map(r => '| ' + [...r.children].map(x => walk(x).trim().replace(/\|/g, '\\|')).join(' | ') + ' |'); if (rows.length) rows.splice(1, 0, '|' + ' --- |'.repeat(rows[0].split(' | ').length)); return rows.join('\n') + '\n\n'; }
      default: return inner();
    }
  }).join('');
  const meta = [`date: ${new Date(p.created).toISOString()}`, p.tags.length ? `tags: [${p.tags.join(', ')}]` : '', p.mood ? `mood: ${p.mood}` : '', p.music ? `music: ${p.music}` : ''].filter(Boolean).join('\n');
  return `---\ntitle: ${p.title || 'Untitled'}\n${meta}\n---\n\n` + walk(d.body).replace(/\n{3,}/g, '\n\n').trim() + '\n';
}

async function journalClick(e) {

  const li = e.target.closest('.entry ul.checklist > li');
  if (li && e.offsetX < (isTouch() ? 44 : 30) && e.target === li) return toggleJournalCheck(li, e);
  const jm = e.target.closest('[data-jm]');
  if (jm) { S.jmode = jm.dataset.jm; V.prefs.journalMode = S.jmode; prefSave(); S.filter = { k: 'all' }; S.q = ''; haptic(6); Snd.click(); renderJournal(); updCrumb(); renderNav(); return; }
  const op = e.target.closest('[data-open]'); if (op) { Snd.click(); return openInEditor(op.dataset.open); }

  const wd = e.target.closest('[data-day]'); if (wd) { S.jmode = 'calendar'; S.jday = wd.dataset.day; S.cal = new Date(wd.dataset.day + 'T12:00'); haptic(6); return renderJournal(); }
  const cd = e.target.closest('[data-cd]'); if (cd) { if (S._calSwiped) { S._calSwiped = false; return; } S.jday = cd.dataset.cd; haptic(6); Snd.click(); return renderJournal(); }
  const yr = e.target.closest('[data-year]'); if (yr) { S.jmode = 'timeline'; S.q = 'year:' + yr.dataset.year; S.jpage = 0; return renderJournal(); }
  const b = e.target.closest('[data-j]'); if (!b) return;
  const j = b.dataset.j, id = b.closest('[data-pid]')?.dataset.pid, P = V.prefs; Snd.click();
  switch (j) {
    case 'cap': return jCapture();
    case 'shuffle': { let n; do n = Math.floor(Math.random() * PROMPTS.length); while (n === S.prompt && PROMPTS.length > 1); S.prompt = n; const q = $('#jpr'); if (q) { q.style.opacity = 0; setTimeout(() => { q.textContent = PROMPTS[n]; q.style.opacity = 1; }, 150); } haptic(5); return; }
    case 'useprompt': return newPost({ title: PROMPTS[S.prompt], html: `<blockquote>${esc(PROMPTS[S.prompt])}</blockquote><p><br></p>`, tags: ['prompt'], category: 'Journal', status: 'posted' });
    case 'opentoday': { const p = todayPage(true); if (!V.posts.has(p.id)) await V.savePost(p); return openInEditor(p.id); }
    case 'writeday': { const t = new Date(S.jday + 'T12:00'); const now = new Date(); if (dayKey(t) === dayKey(now)) t.setHours(now.getHours(), now.getMinutes()); return newPost({ created: t.getTime(), status: 'posted', category: 'Journal' }); }
    case 'mprev': return shiftMonth(-1);

    case 'clear': S.filter = { k: 'all' }; S.q = ''; return render();

    case 'older': S.jpage++; renderJournal(); $('#jr').scrollTop = 0; return;
    case 'calprev': case 'calnext': { const c = S.cal || new Date(); S.cal = new Date(c.getFullYear(), c.getMonth() + (j === 'calnext' ? 1 : -1), 1); return drawCal(); }
    case 'day': S.filter = { k: 'day', v: b.dataset.d }; S.jpage = 0; return render();

async function importDocs() {
  const fs = await pickFiles('.md,.markdown,.txt,.html,.htm,text/plain,text/markdown,text/html', true); if (!fs.length) return;
  const out = [];
  for (const f of fs) {
    const t = await f.text(); let html, title = f.name.replace(/\.[^.]+$/, '');
    let created = f.lastModified || Date.now(), tags = [];
    if (/\.html?$/i.test(f.name)) { const s = sanitizeHTML(t); html = s.html; const h = s.doc.querySelector('h1'); if (h) title = h.textContent.trim(); }
    else {
      let body = t; const fm = t.match(/^---\n([\s\S]*?)\n---\n?/);
      if (fm) { body = t.slice(fm[0].length); const g = k => (fm[1].match(new RegExp('^' + k + ':\\s*(.+)$', 'm')) || [])[1]; if (g('title')) title = g('title').replace(/^["']|["']$/g, ''); const d = Date.parse(g('date') || ''); if (d) created = d; const tg = g('tags'); if (tg) tags = tg.replace(/[\[\]]/g, '').split(',').map(s => s.trim()).filter(Boolean); }
      const h1 = body.match(/^#\s+(.+)$/m); if (h1 && !fm) { title = h1[1].trim(); body = body.replace(h1[0], ''); }
      html = /\.txt$/i.test(f.name) ? body.split(/\n{2,}/).map(p => `<p>${esc(p).replace(/\n/g, '<br>')}</p>`).join('') : sanitizeHTML(mdToHtml(body)).html;
    }
    const p = V.normalize({ title, html, created, updated: Date.now(), tags, status: 'posted' });
    // pull inline data: images into encrypted asset store
    const doc = new DOMParser().parseFromString(`<body>${p.html}</body>`, 'text/html');
    for (const im of $$('img[src^="data:"]', doc.body)) { try { const id = await V.putAsset(await compressImage(dataURLtoBlob(im.src))); im.removeAttribute('src'); im.dataset.asset = id; } catch { im.remove(); } }
    p.html = doc.body.innerHTML; V.derive(p); out.push(p);
  }
  await V.savePosts(out); render(); toast(`Imported ${plural(out.length, 'document')}`, 'ok');
}

function palette() {
  if (!V.unlocked || $('.palette')) return;
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  scrim.innerHTML = `<div class="panel palette"><div class="tbar"><span class="led"></span><span class="ttl grow">Command palette</span><span class="lcd">⌘K</span></div><input class="inp" id="pq" placeholder="Type a command or entry title…" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="res menu" style="position:static;animation:none;box-shadow:none;border:0;background:transparent;max-width:none" id="pres"></div></div>`;
  layerEl().appendChild(scrim);
  const entry = { close: () => { scrim.remove(); Layer.stack = Layer.stack.filter(x => x !== entry); } };
  Layer.stack.push(entry);
  scrim.addEventListener('pointerdown', e => { if (e.target === scrim) entry.close(); });
  const cmds = commands(); let items = [], idx = 0;
  const q = $('#pq', scrim), res = $('#pres', scrim);
  const draw = () => {
    const v = q.value.trim();
    const c = cmds.map(x => ({ ...x, s: fuzzy(v, x.label) })).filter(x => x.s > 0).sort((a, b) => b.s - a.s);
    const posts = v ? [...V.posts.values()].filter(p => !p.trashed).map(p => ({ p, s: fuzzy(v, p.title || 'Untitled') })).filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, 8).map(({ p, s }) => ({ label: p.title || 'Untitled', ico: 'file', sub: fmtDate(p.created, 'short'), s, run: () => { S.view = 'list'; if (!basePred(p)) S.filter = { k: 'all' }; S.sel = p.id; S.showDetail = narrow(); render(); } })) : [];
    items = [...c.slice(0, 12), ...posts]; idx = clamp(idx, 0, Math.max(0, items.length - 1));
    res.innerHTML = items.map((it, i) => `<button class="mi ${i === idx ? 'on' : ''}" data-i="${i}">${icon(it.ico, 'sm')}<span>${esc(it.label)}</span>${it.k ? `<span class="sub">${it.k}</span>` : it.sub ? `<span class="sub">${esc(it.sub)}</span>` : ''}</button>`).join('') || '<div class="faint" style="padding:14px">No matches</div>';
  };
  const runIt = i => { const it = items[i]; if (!it) return; entry.close(); Snd.click(); it.run(); };
  q.oninput = () => { idx = 0; draw(); };
  q.onkeydown = e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); idx = Math.min(idx + 1, items.length - 1); draw(); $('.mi.on', res)?.scrollIntoView({ block: 'nearest' }); }
    if (e.key === 'ArrowUp') { e.preventDefault(); idx = Math.max(idx - 1, 0); draw(); $('.mi.on', res)?.scrollIntoView({ block: 'nearest' }); }
    if (e.key === 'Enter') { e.preventDefault(); runIt(idx); }
  };
  res.onclick = e => { const b = e.target.closest('[data-i]'); if (b) runIt(+b.dataset.i); };
  draw(); setTimeout(() => q.focus(), 30);
}

function iconSVG() { return logoSVG('#3ee0ff', '#7a6bff', 'qi').replace('viewBox="0 0 64 64"', 'viewBox="2 2 60 60" width="512" height="512"'); }
function drawIcon(size, bleed = false) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d');
      if (bleed) { g.fillStyle = '#0b0f14'; g.fillRect(0, 0, size, size); const m = size * .1; g.drawImage(img, m, m, size - 2 * m, size - 2 * m); }
      else g.drawImage(img, 0, 0, size, size);
      res(c.toDataURL('image/png'));
    };
    img.onerror = () => res('');
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(iconSVG());
  });
}

    $('link[rel=apple-touch-icon]').href = apple;
    $('link[rel=icon]').href = fav;
    if (/^https?:/.test(location.protocol)) {
      const url = location.href.split('#')[0];
      const m = { name: 'Quill — private blog', short_name: 'Quill', start_url: url, scope: url.replace(/[^/]*$/, ''), id: url, display: 'standalone', orientation: 'any', background_color: '#090c10', theme_color: '#0a0d11', description: 'Encrypted, offline, private blogging.', icons: [{ src: i192, sizes: '192x192', type: 'image/png' }, { src: i512, sizes: '512x512', type: 'image/png', purpose: 'any' }, { src: mask, sizes: '512x512', type: 'image/png', purpose: 'maskable' }] };
      $('link[rel=manifest]').href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' }));
    }
  } catch { }
}
async function doInstall() {
  const e = window._installEvt;
  if (!e) return alertD('On iPad: open this page in Safari → Share → <b>Add to Home Screen</b>.<br>On Android / Chrome: browser menu → <b>Install app</b>.', 'Install Quill');

/* ================= MAIN ================= */
(async function main() {
  setupPWA();
  $('#shield').innerHTML = logo(88, 'glow') + '<div class="lbl">Quill · private</div>';
  const vv = window.visualViewport;
  const editable = el => el && (el.isContentEditable || (/^(INPUT|TEXTAREA)$/.test(el.tagName) && !/^(checkbox|range|color|button|submit|file)$/.test(el.type)));
  const kb = () => { const ae = document.activeElement; const open = (vv && innerHeight - vv.height > 140) || (isTouch() && editable(ae)); document.body.classList.toggle('kb-open', !!open); document.body.classList.toggle('editing', !!(ae && ae.closest && ae.closest('#edbody,#edtitle,#edtagin,#edmusic'))); };
  const fit = () => { const h = vv ? vv.height : innerHeight; document.documentElement.style.setProperty('--vvh', h + 'px'); if (vv && vv.offsetTop) window.scrollTo(0, 0); if (Editor.floatFor) Editor.positionFloat(); kb(); };
  document.addEventListener('focusin', () => setTimeout(kb, 30)); document.addEventListener('focusout', () => setTimeout(kb, 60));
  ['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => { updFsBtn(); setTimeout(fit, 120); }));
  (vv || window).addEventListener('resize', fit); fit();
  if (vv) vv.addEventListener('scroll', () => { if (vv.offsetTop) window.scrollTo(0, 0); });

  try { await DB.open(); }
  catch (e) {
    $('#boot')?.remove();
    document.body.innerHTML = `<div style="padding:30px;font-family:monospace;color:#f66;background:#000;height:100%">QUILL: cannot open IndexedDB.<br><br>${esc(e.message || e)}<br><br>Private-browsing windows and some file:// contexts block storage. Open Quill from a normal window or host it on HTTPS.</div>`;
    return;
  }
  await V.loadGlobal();
  applySkin(V.global.skin);
  await bootSequence();
  renderLogin();

  setInterval(sessionTick, 1000);
  ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(ev => addEventListener(ev, markActivity, { passive: true, capture: true }));
  document.addEventListener('visibilitychange', onVisibility);
  addEventListener('pagehide', () => { if (V.unlocked) { Editor.flush(); if (V.prefs.shield) document.body.classList.add('shielded'); } });
  addEventListener('beforeunload', e => { if (Editor.dirty) { Editor.flush(); e.preventDefault(); e.returnValue = ''; } });

  let lastNarrow = narrow(), lastEsc = 0;
  addEventListener('resize', debounce(() => {
    if (!V.unlocked) return;
    if (!drawerMode()) document.body.classList.remove('drawer-open');
    const n = narrow(); if (n !== lastNarrow) { lastNarrow = n; S.showDetail = n && !!S.sel; if (S.view === 'list') { $('#content')?.classList.toggle('show-detail', S.showDetail); if (!S.sel) renderEmptyDetail(); } }
  }, 150));

    const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();

      if (document.body.classList.contains('drawer-open')) { document.body.classList.remove('drawer-open'); return; }
      if (Date.now() - lastEsc < 450) { lock('Panic lock'); lastEsc = 0; return; }
      lastEsc = Date.now();
    }
    if (!mod) return;
    if (k === 'k') { e.preventDefault(); palette(); }
    else if (k === 'n') { e.preventDefault(); newPost(); }
    else if (k === 'l') { e.preventDefault(); lock(); }
    else if (k === 'f' && e.shiftKey) { e.preventDefault(); if (Editor.p) Editor.toggleFocus(); }
    else if (k === 'f') {
      e.preventDefault();
      if (Editor.p && document.activeElement && $('#detail')?.contains(document.activeElement)) Editor.toggleFind(true);
      else if ($('#q')) { $('#q').focus(); $('#q').select(); }
      else { S.view = 'list'; render(); setTimeout(() => $('#q')?.focus(), 50); }
    }
    else if (k === 's') { e.preventDefault(); if (Editor.p) Editor.manualSave(); }
  });

  // edge swipe: back from an open entry on phones, otherwise open the navigator drawer
  let edge = null;
  addEventListener('touchstart', e => { const t = e.touches[0]; edge = V.unlocked && drawerMode() && t.clientX < 24 && !Layer.stack.length && !document.body.classList.contains('drawer-open') ? { x: t.clientX, y: t.clientY } : null; }, { passive: true });
  addEventListener('touchmove', e => {
    if (!edge) return; const t = e.touches[0];
    if (t.clientX - edge.x > 70 && Math.abs(t.clientY - edge.y) < 45) {
      edge = null; haptic(8);
      if (narrow() && S.view === 'list' && S.showDetail) { Editor.flush(); closeDetailNarrow(); }
      else document.body.classList.add('drawer-open');
    }
  }, { passive: true });
  // swipe the open drawer closed
  let dsw = null;
  addEventListener('touchstart', e => { dsw = document.body.classList.contains('drawer-open') && e.target.closest('#sidebar') ? e.touches[0].clientX : null; }, { passive: true });
  addEventListener('touchmove', e => { if (dsw != null && dsw - e.touches[0].clientX > 70) { document.body.classList.remove('drawer-open'); dsw = null; } }, { passive: true });

  addEventListener('unhandledrejection', e => { console.error(e.reason); if (V.unlocked) toast(String(e.reason?.message || e.reason).slice(0, 140), 'err', 5000, 'Something went wrong'); });
})();
